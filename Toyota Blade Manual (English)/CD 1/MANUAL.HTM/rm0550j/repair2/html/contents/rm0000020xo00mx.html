		<body onload="seePageAnchor()"><a name="RM0000020XO00MX"></a><table width="100%" cellspacing="0"><tr><td width="93%"><h1>Charging (2GR-FE) Precaution</h1></td><td style="display:none" id="print_button" align="right"><a onclick="window.print()" href="#" class="subwindow-button">Print</a></td></tr></table><br clear="all" class="beforePng"><a name="RM0000020XO00MX_z0"></a><br clear="all"><a name="1"></a><br clear="all"><a name="RM0550J___0000FJ10000011step"></a>
<ol class="step1" style="margin-left:1px;">1. Never disconnect the battery while the engine is running.</ol>
<ol class="ptxt"></ol><br clear="all"><br clear="all"><a name="RM0550J___0000FJ10000012step"></a>
<ol class="step1" style="margin-left:1px;">2. Check that the battery cables are correctly connected to the terminals.</ol>
<ol class="ptxt"></ol><br clear="all"><br clear="all"><a name="RM0550J___0000FJ10000013step"></a>
<ol class="step1" style="margin-left:1px;">3. Do not connect the battery cables while the battery is being quick-charged.</ol>
