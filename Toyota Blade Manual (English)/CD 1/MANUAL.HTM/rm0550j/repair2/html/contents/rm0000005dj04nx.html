		<body onload="seePageAnchor()"><a name="RM0000005DJ04NX"></a><table width="100%" cellspacing="0"><tr><td width="93%"><h1>Standard Bolt Strength Classification of General Standard Nuts</h1></td><td style="display:none" id="print_button" align="right"><a onclick="window.print()" href="#" class="subwindow-button">Print</a></td></tr></table><br clear="all" class="beforePng"><a name="RM0000005DJ04NX_z0"></a><br clear="all"><a name="1"></a><div class="full"><br clear="all"><img src="../../img/d101623.png" name="D101623" alt="D101623" border="1" class="full"></div><br clear="all"><br clear="all"><p><dl class="reference"><dt class="reference">□ HINT □</dt><dt class="reference"></dt></dl><dl class="reference"><dd class="reference">When replacing a nut, use one with the same strength class number as the nut, or one with a higher class number than that of the mating bolt. (Example: bolt = 4T, nut = 4N or higher)</dd></dl></p><br clear="all"></body></html>
