		<body><h3>Charging (2AZ-FE) Precaution</h3><br><a href="#" onclick="javascript:parent.contents.location.href='rm0000020xo00bx.html#1';return false;"><br></a><ol class="step1-num"><li><p><a href="#" onclick="javascript:parent.contents.location.href='rm0000020xo00bx.html#RM0550J___00003YU0000011step';return false;"><ptxt>Never disconnect the battery while the engine is running.</ptxt></a></p></li></ol><ol class="step1-num"><li value="2"><p><a href="#" onclick="javascript:parent.contents.location.href='rm0000020xo00bx.html#RM0550J___00003YU0000012step';return false;"><ptxt>Check that the battery cables are correctly connected to the terminals.</ptxt></a></p></li></ol><ol class="step1-num"><li value="3"><p><a href="#" onclick="javascript:parent.contents.location.href='rm0000020xo00bx.html#RM0550J___00003YU0000013step';return false;"><ptxt>Do not connect the battery cables while the battery is being quick-charged.</ptxt></a></p></li></ol></body></html>
