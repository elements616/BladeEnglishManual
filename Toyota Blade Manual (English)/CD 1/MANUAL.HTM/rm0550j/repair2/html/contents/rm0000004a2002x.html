		<body onload="seePageAnchor()"><a name="RM0000004A2002X"></a><table width="100%" cellspacing="0"><tr><td width="93%"><h1>Side Mudguard LH Removal</h1></td><td style="display:none" id="print_button" align="right"><a onclick="window.print()" href="#" class="subwindow-button">Print</a></td></tr></table><h2>Preparation List<a href="#" onclick="openSeePage('ppr','RM0000004A2002X');return false;"><img border="0" src="../../../../image/extxref.png"></a></h2><br clear="all" class="beforePng"><a name="RM0000004A2002X_04"></a><br clear="all" class="beforePng"><a name="RM0000004A2002X_04_0006"></a><table width="100%" cellspacing="0" border="0" class="s1r"><tr><td class="s1r">1. Remove Side Mudguard Assembly LH</td></tr></table><font class="ptxt"></font>
<ol class="s2"><br clear="all" class="beforePng"><br clear="all" class="beforePng"><table class="float"><tr><td><img src="../../img/b164522j01.png" name="B164522J01" alt="B164522J01" border="1" class="half"><br></td></tr></table>
<li><p><font class="ptxt">Apply protective tape around the side mudguard assembly LH.</font><br></p></li>
<li><p><font class="ptxt">Remove the 2 screws and 9 retainers.</font><br></p></li><br clear="all" class="beforePng"><br clear="all" class="beforePng"><table class="float"><tr><td><img src="../../img/b164523.png" name="B164523" alt="B164523" border="1" class="half"><br></td></tr></table>
<li><p><font class="ptxt">Disengage the 9 clips and remove the side mudguard assembly LH.</font><br></p></li></ol><br clear="all"></body></html>
