<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/legacy.css">
<script src="../../_runtime/compat.js"></script>
	
	<script type="text/javascript" src="./scripts/top_select.js"></script>
	<script type="text/javascript" src="./scripts/lib/url.js"></script>
	<script type="text/javascript" src="./scripts/lib/hashtable.js"></script>
	<link rel="stylesheet" href="./styles/HEAD.CSS">
	<style>
	/* converter: draw these buttons like the Repair Manual Contents List header (repair/css/global.css
	   a.other-rpr-button / a.button): one line of 8pt text in a grey-blue box with a light border.
	   The 90px-wide cells made the English labels wrap and overflow the 30px header frame. */
	td.button3, td.button { width: auto !important; height: auto; white-space: nowrap; padding: 2px 6px;
		font: 8pt Arial, Helvetica, sans-serif; line-height: 13px; text-align: center; vertical-align: middle;
		color: #ffffff; background-color: #86a2b0; border: 1px solid #cccccc; }
	td.button3 a, td.button a { font: inherit; line-height: inherit; color: #ffffff; text-decoration: none; }
	td.button3 a:hover, td.button a:hover { color: #cccccc; }
	td.space { width: 4px; min-width: 4px; padding: 0; }
	</style>
</head>


<body TOPMARGIN="5" LEFTMARGIN="0" MARGINWIDTH="0" MARGINHEIGHT="0">
<table width="100%">
	<tr>
		<td width="15%">
			<!-- Left -->
		</td>
		<td width="50%" align="left">
			<!-- Center -->
			<table cellpadding="0" cellspacing="0" border="0">
				<tr> 
					<td class="space">
					<td class="button3">
						<a HREF=# onClick="call_runOnClickRepair()">Repair Manual</a>
					</td>
					<td class="space"></td>
					<td class="button3">
						<a HREF=# onClick="call_runOnClickNFC()">New Car Features</a>
					</td>
					<td class="space"></td>
					<td class="button3">
						<a HREF=# onClick="call_runOnClickEWD()">Electrical Wiring Diagram</a>
					</td>
					<td class="space"></td>
					<td class="button3">
						<a HREF=# onClick="call_runOnClickRepairFRP()">Function-Specific Repair Manual</a>
					</td>
					<td class="space"></td>
				</tr>
			</table>
		</td>
		<td width="35%" align="right">
			<!-- Right -->
			<table cellpadding="0" cellspacing="0" border="0">
				<tr> 
					<td class="space"></td>
					<td class="button">
						<a href=# onClick="call_runOnClickOtherWindow()">Show in Separate Window</a>
					</td>
					<td class="space"></td>
					<td class="button">
						<a href=# onClick="call_runOnClickLinkToTop()">To Function Selection</a>
					</td>
					<td class="space"></td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
