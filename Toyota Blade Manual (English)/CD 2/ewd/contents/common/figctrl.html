<!DOCTYPE html>
<html lang="en">
<HEAD>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>
	
	<TITLE>Control</TITLE>
	<script type="text/javascript" src="../../scripts/fig/figctrl.js"></script>
	<script type="text/javascript" src="../../scripts/lib/url.js"></script>
	<script type="text/javascript" src="../../scripts/lib/hashtable.js"></script>
	<link rel="stylesheet" href="../../styles/basic.css" />
</HEAD>

<BODY bgcolor="white" onload="call_runOnLoadProc()">
	<table width="100%" cellspacing="0" cellpadding="0" border="0">
		<tr>
			<td align="left">
				<table border="0">
					<tr>
						<td>
							<select name="d_zoomSelector" style="visibility:hidden;" onChange="call_zooming()">
								<option>50%</option>
								<option>60%</option>
								<option>80%</option>
								<option selected>100%</option>
								<option>150%</option>
								<option>200%</option>
								<option>400%</option>
								<option>800%</option>
								<option>1600%</option>
								<option>3200%</option>
							</select>
						</td>
						<td>
							<div id="page_select" style="visibility:hidden;">
								<span id="page_no_1" style="margin:0px 10px; cursor:hand; color:blue; text-decoration:underline;" onclick="call_runOnClickPage(1)">1</span>
								<span id="page_no_2" style="margin:0px 10px; cursor:hand; color:blue; text-decoration:underline;" onclick="call_runOnClickPage(2)">2</span>
							</div>
						</td>
						<td>
							<table id="fig_select" style="visibility:hidden;" cellspacing="0" cellpadding="0" border="0">
								<tr>
									<td><input id="fig_back" type="button" value="<" class="button1" onclick="call_runOnClickFigBack()" /></td>
									<td><span id="fig_no" style="padding:0px 8px;"></span></td>
									<td><input id="fig_next" type="button" value=">" class="button1" onclick="call_runOnClickFigNext()" /></td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
			<td align="center">
				<table border="0">
					<tr>
						<td>
							<input type="button" id="fit"    value="Normal" class="button1" title="Fit to Screen" onclick="call_fitToWindow()" />
							<input type="button" id="d_zIn"  value="Zoom In" class="button1" title="Zoom In" onClick="call_zoomIn()" />
							<input type="button" id="d_zOut" value="Zoom Out" class="button1" title="Zoom Out" onClick="call_zoomOut()" />
							<input type="button" id="d_fit"  value="Whole" class="button1" title="Show Entire Image" onClick="call_showWhole()" />
						</td>
					</tr>
				</table>
			</td>
			<td align="right">
				<table border="0">
					<tr>
						<td valign="top">
							<input type="button" id="d_showConnList" value="Show Connector" class="button1" title="Show connectors connected to the selected wire" style="visibility:hidden" onclick="call_showConnectList()" />
						</td>
						<td>
							<img src="../../icon/vbar.png" />
							<img src="../../icon/print.png" name="d_print" title="Print" onclick="call_printEWD()" />
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</BODY>
</HTML>
