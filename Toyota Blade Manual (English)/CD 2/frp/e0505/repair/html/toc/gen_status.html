<!DOCTYPE html>
<!-- $Id: gen_status.html,v 1.16 2004/04/01 07:37:34 s-okino Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - General Paragraph</title>

<link href="../../css/status.css" rel="stylesheet" type="text/css">

<script language="javascript">
function init() {
	if (parent.g_objXml == null || parent.g_paraId == null ) {
		alert("Relevant File "+parent.g_paraId+".xml does not exist.");
		return;
	}
	var paraParentParameter = parent.getParaParentParameter(parent.g_tocXml, parent.g_paraId);
	var paraName    = parent.findParameterValue("paraname" , paraParentParameter);
	var titleName   = parent.findParameterValue("ttlname" , paraParentParameter);
	var sectionName = parent.findParameterValue("sectionname" , paraParentParameter);
	var statusTitle = "<p class='location'>"+sectionName+"／"+titleName+"／"+paraName+"</p>";
	disp.innerHTML = statusTitle;
	if (parent.g_category=="M"||parent.g_category=="N") {
		generalMemo.style.display="none";
	}else{
		var subparaNode = parent.g_objXml.selectSingleNode("//subpara");
		if ( subparaNode == null ) {
			alert("Relevant File "+parent.g_paraId+".xml has no subparaNode.");
			return;
		}
		var textId = subparaNode.getAttribute("id");
		var memoId = subparaNode.getAttribute("proc-id");
		generalMemo.innerHTML = 
			 "<a href=\"javascript:parent.openMemo('"+textId+"','"+memoId+"');\" >"
			+"<img src='../../img/memo.png' id='"+memoId	+"'  border='0'/> "
			+"</a>"
			;
		parent.loadMemoData (document,parent.REPAIR);
	}

}
</script>
</head>
<body onLoad="init();">
<table width="100%" border="0" cellspacing="0" cellpadding="2">
	<tr>
		<td><div id="disp"></div></td>
		<td id="generalMemo" align="right" width="40"></td>
	</tr>
</table>
</body>
</html>
