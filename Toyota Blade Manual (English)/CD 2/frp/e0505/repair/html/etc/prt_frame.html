<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Print</title>

<script src="../../js/xml.js"></script>
<script src="../../js/util.js"></script>
<script src="../../js/style.js"></script>
<script language="javascript">
var args  = window.dialogArguments;
if( args != null && args.length > 2 ){
	document.title = "[Electronic Technical Manual] - "+args[2];
}

//
//  Contents画面の初期表示
//  初期化
//
function initContents() {
	if (args == null || args.length < 3) {
		alert("The parameter is invalid.");
		return;
	}
//	global.document.title = "[電子技術マニュアル] - "+args[2];
	contents.document.title = "[Electronic Technical Manual] - "+args[2];
	contents.ttl.innerHTML  = args[0];
	contents.disp.innerHTML = args[1];
	if ( args[2] == null || args[2] == ""){
		disableSeepage(contents.document);
	}
	if ( args[2] == "Print Troubleshooting Contents"){
		disableLink(contents.document);
	}else{
		disableSeepage(contents.document);
	}
}
</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="prt_global.html" scrolling="no" noresize frameborder="no">
	<frame name="contents" src="prt_contents.html" frameborder="no">
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
