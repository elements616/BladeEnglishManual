<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>


<title>[Electronic Technical Manual] - Title Selection</title>
<script language="javascript">
//
//  Contents画面の初期表示
//  初期化
//
function initContents() {
	var args = window.dialogArguments;
	if (args == null || args.length != 4) {
		alert("The parameter is invalid.");
		return;
	}
	var objXml = args[0];
	var ttlIds = args[1];
	var dispPage =  "";

	dispPage =  "<table border='1' width='100%' cellspacing='0' cellpadding='0' bordercolor='#FFFFFF'>"
		+ "<tr><th class='pointdisplaytitle' width='85%'><b>Section/Title</b></th></tr>";

	for (var i=0; i<ttlIds.length; i++) {
		ttlIdNode = ttlIds.item(i);
		ttlId = ttlIdNode.nodeTypedValue;
		
		ttlNode = objXml.selectSingleNode("//ttl[@id='"+ttlId+"']");
		secNode = ttlNode.parentNode
		secName = secNode.getElementsByTagName("name").item(0).nodeTypedValue;
		
		ttlNameNode = objXml.selectSingleNode("//ttl[@id='"+ttlId+"']/name");
		ttlName = ttlNameNode.nodeTypedValue;
		dispPage += "<tr><td class='tbl-par'>"
			+ "<a class='tbl-para' href='#' onClick=returnValue='"+ttlId+"';parent.window.close();>"
			+ secName +"／"
			+  ttlName
			+ "</a></td></tr>";
	}

	dispPage =  dispPage
		+ "</table>";

	contents.disp.innerHTML = dispPage ;
}
//
//  Global画面の初期表示
//  初期化
//
function initGlobal() {
	var args = window.dialogArguments;
	if (args == null || args.length != 4) {
		alert("The parameter is invalid.");
		return;
	}
	var partsXml = args[2];
	var partsId = args[3];
	var partsNameNode = partsXml.selectSingleNode("//parts[@id='"+partsId+"']");
	var partsName = partsNameNode.nodeTypedValue;
	global.disp.innerText = partsName;
}
</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="ttl_global.html" scrolling="no" noresize frameborder="no">
	<frame name="contents" src="ttl_contents.html" frameborder="no">
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
