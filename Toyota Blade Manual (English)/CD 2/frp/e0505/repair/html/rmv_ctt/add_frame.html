var g_xmlCache      = new Hashtable();
var args = window.dialogArguments;

var g_contentsXsl   = initXsl("../../xsl/rmv/through.xsl");
var g_topContentsId;
var g_cttXml;

var cotentsNode = g_localXml.selectNodes("//para[@category='M']");
if(cotentsNode.item(0)!= null){
	g_topContentsId = cotentsNode.item(0).getAttribute("id");
	g_cttXml = initXml(g_topContentsId.toLowerCase()+".xml");//初期表示用XML
	if (g_cttXml != null) {
		g_xmlCache.put(g_topContentsId, g_cttXml);

}
