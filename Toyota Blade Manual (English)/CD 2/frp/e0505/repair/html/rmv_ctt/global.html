//「準備品」クリック時
function switchPreparation(){
	var paraId = parent.g_nowParagraphId;
	if( paraId == null )  paraId = parent.g_firstParagraphId;
	if( paraId == null )  return; 
	if (parent.g_category!="G") {
		var args = new Array(paraId);
	} else {
		var ttlId = parent.g_tocXml.selectSingleNode("//ttl[child::para[@id='"+paraId+"']]").getAttribute("id");
		var paraItems = parent.g_tocXml.selectNodes("//ttl[@id='"+ ttlId +"']/para[@category='G']/@id");
		var args = new Array();
		for (var i=0; i<paraItems.length; i++) {
			var paraid = paraItems.item(i).nodeTypedValue;
			args.push(paraid);
		}
	}
	parent.setDisplayArgs(args );
	//準備品を画面で表示する
	parent.openDialog("ppr", "ppr_frame.html");
}

//「印刷（要領スルー）」クリック時

		parent.openDialog("pdisplay", "trt_frame.html");

		parent.printFrame(parent.sts.disp.innerHTML,parent.contents.disp.innerHTML,'Print Removal/Installation Procedure');

//「構成図」クリック時
function switchComponent(){
	var args = getComponentArgs();
	if( args == null )  return; 
	parent.setDisplayArgs(args );

	//構成図を画面で表示する
	parent.openDialog("component", "cmp_frame.html");
}

//「構成図」のイラストIDを取得する
function getComponentArgs(){
	var illustId = parent.findParameterValue("illust" ,location.search, parent.location.search);
	var secId    = parent.g_sectionId;
	var secvarId = parent.g_sectionVa;
	var ttlId    = parent.g_titleId;
	var paraId   = parent.g_paraId;
	if( secId  == null || secvarId ==null || ttlId ==null) {
		var  str = parent.getParaParentParameter(parent.g_tocXml , paraId );
		secId    = parent.findParameterValue("section" ,  str );
		secvarId = parent.findParameterValue("sectionvar" ,  str );
		ttlId    = parent.findParameterValue("ttl" ,  str );
	}

	var procXml  = parent.initXml("proc_"+secId+".xml",false,false);
	if ( procXml == null ) {
		alert("Relevant File "+"proc_"+ secId +".xml does not exist.");
		return;
	}
	var sId = parent.g_nowTitleId;

	//手順から部品IDを取得する
	var s1partNode = procXml.selectSingleNode("//subpara/s-1[@id='"+ sId+"']/parts");
	if( s1partNode == null){
		alert("There is no applicable part. [Procedure ID:"+sId+"]");
		return null;
	}
	var partId   = s1partNode.getAttribute("id");

	//もし絵目次から場合は　イラストIDに部品IDを含むかどうか判断
	//alert("もし絵目次から場合は　部品ID("+partId +")を含むイラストID("+illustId+")を探す");
	var illustPartNode = parent.g_compoXml.selectSingleNode("//illust[@id='"+ illustId +"']/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId, illustId, parent.sts.disp.innerHTML);
	}

	//alert("同一タイトル内で　部品ID("+partId +")を含むイラストID("+illustId+")を探す");
	//同一タイトル内で　部品IDを含むイラストIDを探す
	illustPartNode = parent.g_compoXml.selectSingleNode("//ttl[@id='"+ ttlId +"']/para[@category='K' ]/subpara/illust/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId, illustPartNode.parentNode.getAttribute("id"), parent.sts.disp.innerHTML);
	}

	//alert("同一セクション内で　部品ID("+partId +")を含むイラストIDを探す");
	//同一セクション内で　部品IDを含むイラストIDを探す
	illustPartNode = parent.g_compoXml.selectSingleNode("//section[@id='"+ secId +"']/ttl/para[@category='K' ]/subpara/illust/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId , illustPartNode.parentNode.getAttribute("id"), parent.sts.disp.innerHTML);
	}
	alert("There is no applicable component diagram. [Procedure ID:"+sId+"]");
	return null;
}
function init() {
	if (parent.g_category=="A") {
		var nodes = parent.g_tocXml.selectNodes("//para[@category='M']");
		if ((nodes != null) && (nodes.length>0)) {
			additional.style.display = "inline";
			additional.style.visibility = "visible";
		} else {
			additional.style.display = "inline";
			additional.style.visibility = "hidden";
		}
	} else {
		additional.style.display = "none";
	}
	enabledPreparation();
	disabledComponent();
	parts.style.display = (parent.g_category=="G")?"inline":"none";
}

// 準備品リンクの表示/非表示切替
function enabledPreparation() {
	var paraId = parent.g_nowParagraphId;
	if (paraId == null)  paraId = parent.g_firstParagraphId;
	if (paraId == null) {
		ppr.style.visibility="hidden";
		return;
	}
	if (parent.g_category!="G") {
		paraId = paraId.toLowerCase()
		var pprXml = parent.initXml("ppr_"+paraId+".xml", false, false);
		ppr.style.visibility = (pprXml==null)?"hidden":"visible";
	} else {
		var ttlId = parent.g_tocXml.selectSingleNode("//ttl[child::para[@id='"+paraId+"']]").getAttribute("id");
		var paraItems = parent.g_tocXml.selectNodes("//ttl[@id='"+ ttlId +"']/para[@category='G']/@id");
		if (paraItems==null) {
			ppr.style.visibility="hidden";
			return;
		}
		for (var i=0; i<paraItems.length; i++) {
			var paraid = paraItems.item(i).nodeTypedValue;
			paraid = paraid.toLowerCase();
			var pprXml = parent.initXml("ppr_"+paraid+".xml", false, false);
			if (pprXml!=null) {
				ppr.style.visibility="visible";
				return;
			}
		}
		ppr.style.visibility="hidden";
	}
}

// 構成図リンクの表示/非表示切替
function disabledComponent() {
	if (parent.g_category=="A") {
		var frpXml = parent.initXml("../../../../frp.xml", true, false);
		component.style.visibility = (frpXml!=null)?"hidden":"visible";
	} else {
		component.style.visibility = "hidden";
	}
}

//「付随作業」クリック時
function switchAdditional(){
	parent.setDisplayArgs(new Array(parent.g_tocXml));
	//付随作業を画面で表示する
	parent.openDialog("additional", "add_frame.html");
}

//「部品配置図」クリック時
function switchParts(){
	var args = getPartsArgs();
	if( args == null )  return; 
	parent.setDisplayArgs(args );
	//部品配置図を画面で表示する
	parent.openDialog("component", "parts_frame.html");
}

//「部品配置図」のイラストIDを取得する
function getPartsArgs(){
	var paraId   = parent.g_nowParagraphId;
	if (paraId == null)  paraId = parent.g_firstParagraphId;

	var  str = parent.getParaParentParameter(parent.g_tocXml , paraId);
	var servcatId = parent.findParameterValue("servcat" ,  str);
	var secId = parent.findParameterValue("section" , str);
	var ttlId = parent.findParameterValue("ttl" , str);

	var psrhObjXml = parent.initXml("psearch_"+ servcatId.toLowerCase() +".xml");

	//タイトルから部品IDを取得する
	if (psrhObjXml==null) {
		alert("Relevant File"+"psearch_"+servcatId+".xml does not exist.");
	}
	var ttlpartNode = psrhObjXml.selectSingleNode("//ttl[@id='"+ ttlId +"']/parts");
	if( ttlpartNode == null){
		alert("There is no applicable part. [Title ID:"+ttlId +"]");
		return null;
	}
	var partId = ttlpartNode.getAttribute("id");

	//同一タイトル内で　部品IDを含むイラストIDを探す
	illustPartNode = parent.g_compoXml.selectSingleNode("//ttl[@id='"+ ttlId +"']/para[@category='R' ]/subpara/illust/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId , illustPartNode.parentNode.getAttribute("id"), parent.sts.disp.innerHTML);
	}

	//同一セクション内で　部品IDを含むイラストIDを探す
	illustPartNode = parent.g_compoXml.selectSingleNode("//section[@id='"+ secId +"']/ttl/para[@category='R' ]/subpara/illust/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId , illustPartNode.parentNode.getAttribute("id"), parent.sts.disp.innerHTML);
	}

	//同一サービスカテゴリ内で　部品IDを含むイラストIDを探す
	illustPartNode = parent.g_compoXml.selectSingleNode("//servcat[@id='"+ parent.g_servcatId +"']/section/ttl/para[@category='R' ]/subpara/illust/parts[@id='"+ partId +"']");
	if( illustPartNode != null){
		return new Array(partId , illustPartNode.parentNode.getAttribute("id"), parent.sts.disp.innerHTML);
	}
	alert("There is no applicable parts location diagram. [Title ID:"+ttlId +"]");
	return null;
}
