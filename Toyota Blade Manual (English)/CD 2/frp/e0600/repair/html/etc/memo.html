<!DOCTYPE html>
<!-- $Id: memo.html,v 1.10 2004/04/01 07:37:35 s-okino Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Repair Manual Memo</title>

<link href="../../css/memo.css" rel="stylesheet" type="text/css">
<script language="JavaScript" src="../../js/xml.js"></script>
<script language="JavaScript" src="../../js/hashtable.js"></script>
<script language="JavaScript" src="../../js/util.js"></script>
<script language="javascript">
var g_parentWin;
var g_memoId ;
var g_markId ;
//
//  初期化
//
function init() {
	var args = window.dialogArguments;
	if (args == null || args.length == null || args.length != 4 ) {
		alert("There is no applicable parameter.");
		return;
	}

	var textId   = dialogArguments[0];
	g_memoId     = dialogArguments[1];
	g_markId     = dialogArguments[2];
	g_parentWin  = dialogArguments[3];

	var i = textId.indexOf("_");
	if( i == -1 ){
		alert("There is no applicable paragraph. [textId: "+textId+"]");
		return;
	}
	var titleText  = "";

	var paraXml = initXml(textId.substring(0,i)+".xml",false,false);
	if ( paraXml == null ) {
		alert("Relevant File "+textId.substring(0,i)+".xml does not exist.");
		return;
	}
	var paraNode = paraXml.selectSingleNode("//para");
	var category = paraNode.getAttribute("category");
	//alert("[textId: "+textId+"] [g_memoId: "+g_memoId+"] [category: "+category+"]");
	switch ( category ) {
		//脱着か点検から　手順S-1IDのメモ処理
		case "A":
		case "M":
		case "N":
		case "G":
			var textNode = paraXml.selectSingleNode("//s-1[@id='"+ textId +"']");
			if (textNode != null) {
				titleText  = textNode.getElementsByTagName("ptxt").item(0).nodeTypedValue;
			}
			break;
		//トラブルシュートから　testgrpIDのメモ処理
		case "C":
		case "J":
			var textNode = paraXml.selectSingleNode("//testgrp[@id='"+ textId +"']");
			if (textNode != null) {
				titleText = textNode.getElementsByTagName("testtitle").item(0).nodeTypedValue;
			}
			break;
		//一般パラグラフから　subparaIDのメモ処理
		case "L":
		case "F":
		case "H":
		case "S":
		case "T":
		case "D":
		case "U":
		case "V":
			//var textNode = paraXml.selectSingleNode("//subpara[@id='"+ textId +"']");
			var textNode = paraXml.selectSingleNode("//subpara");
			if (textNode != null) {
				titleText = textNode.parentNode.getElementsByTagName("name").item(0).nodeTypedValue;
			}
			break;
		//その他
		default:
			var textNode = paraXml.selectSingleNode("//subpara");
			if (textNode != null) {
				titleText = textNode.parentNode.getElementsByTagName("name").item(0).nodeTypedValue;
			}
	}
	disp.innerHTML = titleText;
	memoForm.memoArea.value = g_parentWin.readMemo(g_memoId,g_markId);
}
</script>
</head>
<body onload="init()">
<p id="disp" class="s1"></p>
<form id="memoForm">
	<textarea class="storeuserData" id="memoArea" name="" rows="8" cols="64" style="font-family: sans-serif"></textarea>
	<table width="90%">
		<tr>
			<td align="right">
			<a class="memo-button" href="#" onClick="try{ g_parentWin.closeMemo(g_memoId, memoForm.memoArea.value, g_markId);}catch(e){};window.close();">Save</a>
			<a class="memo-button" href="#" onClick="window.close();">Cancel</a>
			</td>
		</tr>
	</table>
</form>
</body>
</html>
