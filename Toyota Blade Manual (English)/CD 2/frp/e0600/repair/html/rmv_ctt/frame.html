<title>[Electronic Technical Manual] - Removal/Installation Procedure</title>

<script src="../../js/xml.js"></script>
<script src="../../js/util.js"></script>
<script src="../../js/hashtable.js"></script>
<script src="../../js/style.js"></script>
<script src="../../js/dom.js"></script>
<script src="../../js/memo.js"></script>
<script language="JavaScript"> 
<!--
//
//  文書構成XMLファイル,脱着XSLファイルを読み込みDOMオブジェクトを作成。
//  作成したDOMオブジェクトを使用して指定されたHTML要素に画面表示。
//
var g_flag = 0;//through or Not//default=notThrough
var g_firstParagraphId = null;
var g_nowParagraphId = null;
var g_nowTitleId = null;
var g_nowObjXml = null;
var g_nowContXsl = null;
var g_hashXml = new Hashtable();
var g_hashPara = new Hashtable();
var g_compoXml = initXml("components.xml");
g_compoXml.setProperty("SelectionLanguage", "XPath");
var g_tocXml = initXml("toc_rpr.xml");
g_tocXml.setProperty("SelectionLanguage", "XPath");
var g_term = getParameterValue("term");	
var g_sectionId = getParameterValue("section");
var g_sectionVa = getParameterValue("sectionvar");
var g_titleId = getParameterValue("ttl");
var g_titleVa = getParameterValue("ttlvar");
var g_paraId = getParameterValue("parag");
var g_bp = getParameterValue("bp");
var g_bd = getParameterValue("bd");
var g_partId = getParameterValue("partId");
var g_s1Id = null;
var g_paraList;
var g_category = null;

init();
getParagMenu(g_paraList);

//
function init(){
	if(g_paraId == null)	g_paraList = getParagraphList(g_tocXml,g_sectionId,g_sectionVa,g_titleId,g_titleVa);
	else					getParaListFromParaId();
}

//目次からparaIdが渡ってきた場合
function getParaListFromParaId(){
	var ttlNode = g_tocXml.selectSingleNode("//ttl[child::para[@id='"+g_paraId+"']]");
	g_paraList = ttlNode.selectNodes("para[@category='A' or @category='F' or @category='L' or @category='M' or @category='N' or @category='G' or @category='D' or @category='U']");
}

//frameロード時に実行：localフレームに出力するparagraphのメニューをparagraphMenuに保存	
function getParagMenu(paraList){
	var procXml = initXml("proc_" + g_sectionId + ".xml", false, false);
	if (procXml != null && g_partId != null && g_paraId == null) {
		var s1List = procXml.selectNodes("//s-1[parts[@id='" + g_partId + "']]");
		for (i = 0; i < s1List.length; ++i) {
			var s1Id = s1List.item(i).getAttribute("id");
			for(j = 0; j < paraList.length; ++j) {
				var paraId = paraList.item(j).getAttribute("id");
				if (s1Id.indexOf(paraId, 0) >= 0) {
					g_paraId = paraId;
					g_s1Id = s1Id;
					break;
				}
			}
			if (g_paraId != null) {
				break;
			}
		}
	}
	for(i=0;i<paraList.length;i++){
		var paraNode = paraList.item(i);
		var paraId = paraNode.getAttribute("id");
		var category = paraNode.getAttribute("category");
		if(i==0 && g_paraId == null) {//点検からの遷移時
			g_firstParagraphId = paraId;//初めのパラグラフIDを退避
			parent.g_category = parent.g_tocXml.selectSingleNode("//para[@id='"+paraId+"']").getAttribute("category");
		}
		if(i==0 && g_paraId != null) {//絵目次、目次一覧からの遷移時
			g_firstParagraphId = g_paraId;//目次から渡ってきたパラグラフIDを格納
			parent.g_category = parent.g_tocXml.selectSingleNode("//para[@id='"+g_paraId+"']").getAttribute("category");
		}
		var contXml = initXml(paraId.toLowerCase() + ".xml", false, false);
		if (contXml != null) {
			g_hashXml.put(paraId,contXml);
		}
		var pname = paraNode.selectSingleNode("name").nodeTypedValue;
		g_hashPara.put(paraId,pname);
	}
}

setSeePageMargin((screen.width - 650)/2);

-->
</script>

	<frameset cols="250, *" frameborder="yes" border="1" framespacing="1" bordercolor="#cccccc">
		<frame name="local" src="local.html" frameborder="no" >
		<frameset rows="30, *" frameborder="no" border="0" framespaceing="0">
			<frame name="sts" src="status.html" frameborder="no" scrolling="auto">
			<frame name="contents" src="contents.html" frameborder="no">
		</frameset>
	</frameset>
</frameset>

	<body>Please use a browser that supports frames</body>
</noframes>
