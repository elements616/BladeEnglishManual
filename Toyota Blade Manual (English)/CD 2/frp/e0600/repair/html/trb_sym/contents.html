<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Symptom</title>


<link href="../../css/contents.css" rel="stylesheet" type="text/css">
<script language="javascript">
function init() {
	for (var i=0; i<parent.g_areaParaXmlList.length; i++) {
		var xml = parent.g_areaParaXmlList[i];
		var areaId = parent.g_areaIdList[i];
		var args = new parent.Hashtable();
		var term = parent.getParameterValue("term");
		args.put("ref", areaId);
		args.put("term", term);
		if (i==0)
			parent.iterateDisplay(xml, parent.g_cttXsl, disp, args, true);
		else
			parent.iterateDisplay(xml, parent.g_cttXsl, disp, args, false);
	}
	// 頭出し
	location.hash=(parent.g_refId).substring((parent.g_refId).search("_")+1, parent.g_refId.length);

	parent.loadMemoData (document,parent.REPAIR);
}
</script>
</head>
<body onLoad="init()">
	<div id="disp"></div>
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
</body>
</html>
