<html lang="en">
<head>
<meta charset="utf-8">

<title>[Electronic Technical Manual] - Removal/Installation Illustrated Index</title>

<link href="../../css/button.css" rel="stylesheet" type="text/css">
<script src="../../js/svgpage.js"></script>
<script language="javascript">
var g_procXml;
var g_ttlId      ="";
var g_paraId     ="";
var g_termId     ="";
var g_paraParentParameter   ="";

//
//  ローカル画面の初期表示
//  初期化
//
function init() {
	g_illustId = parent.findParameterValue("illust", location.search, parent.location.search);
	g_termId   = parent.findParameterValue("term",   location.search, parent.location.search);
	g_paraId   = parent.findParameterValue("parag",  location.search, parent.location.search, parent.sts.location.search, parent.contents.location.search);
	if (g_paraId == null) {
		//alert("パラグラフIDが指定されていません。");
		return;
	}

	g_paraParentParameter = parent.getParaParentParameter(parent.g_tocXml , g_paraId );
	g_ttlId  = parent.findParameterValue("ttl" , g_paraParentParameter);
	secId    = parent.findParameterValue("section" , g_paraParentParameter);
	secvarId = parent.findParameterValue("sectionvar" , g_paraParentParameter);
	//alert("g_paraParentParameter="+g_paraParentParameter);
	//alert("secId ="+secId +" secvarId ="+secvarId +" g_ttlId="+g_ttlId);

	g_procXml  = parent.initXml("proc_"+secId+".xml",false,false);
	if ( g_procXml == null ) {
		alert("Relevant File "+"proc_"+ secId +".xml does not exist.");
		return;
	}
	//alert("g_procXml="+"proc_"+secId+".xml");
	var SVGItem = parent.getIllustIdList(g_paraId);
	if (SVGItem == null ){
		alert("("+g_paraId+") illustration ID list cannot be obtained.");
		return;
	}
	if( g_illustId == null ){
		g_illustId = SVGItem[0];
	}else{
		for(var i=0;i<SVGItem.length;i++){ 
			if(SVGItem[i] == g_illustId) break;
			if(i == SVGItem.length-1) g_illustId = SVGItem[0];
		}
	}

	var  dispPage = createDispPage(SVGItem);
	document.body.innerHTML = dispPage ; 
	//SVG表示画面にSVGページを表示する
	selPage(g_illustId);
}

//
//  脱着　個別表示画面
//
function singleDisplay() {
	var s1Url  = "s1_frame.html";
	var prtUrl = "s1prt_frame.html";
	var partId = parent.contents.getXMLSelectPartID();
	if( partId == null || partId == "" ){
		alert("Please select a part.");
		return;
	}
	//全部タイトルに手順含む部品ID完全一致のデータを探す
	var partsList = g_procXml.selectNodes(
		"//ttl/para[@category='A' ]/subpara/s-1[@proc-id and @proc-id!='']/parts[@id='"
		+ partId +"']");
	//alert("partId ="+partId+"   partItems.length="+partsList.length);
	var ttlId = "";
	if ( partsList.length > 0 ) {
		var ttlIds;
		// タイトルIDを抽出する
		var ttlIdTbl = new parent.Hashtable();
		for (var i=0; i<partsList.length; i++) {
			ttlId = partsList.item(i).parentNode.parentNode.parentNode.parentNode.getAttribute("id");
			ttlIdTbl.put(ttlId, ttlId);
		}
		ttlIds = ttlIdTbl.values();
		// 表示対象のタイトルを決定する
		if ( ttlIds.length > 1 ) {
			// タイトルID選択ダイアログ表示
			var ret = selectTitleDialog(partId, ttlIds, false);
			if( ret == "close") {
				return;
			} else {
				ttlId = ret;
			}
		} else {
			ttlId = ttlIds[0];
		}
	} else {
		alert("The applicable procedure has not been created. [Part ID:"+partId +"]");
		return;
	}

	//alert("ttlId="+ttlId);
	var objTemp  = new ActiveXObject("Msxml2.XSLTemplate");
	objTemp.stylesheet = parent.g_runXsl;
	var objProc  = objTemp.createProcessor();

	var dispPage =  "";

	// 検索された全部品に関連する要領を取得する
	for (var i=0; i<partsList.length; i++) {
		sId = partsList[i].parentNode.getAttribute("id");
		procId = partsList[i].parentNode.getAttribute("proc-id");
		paraNode = partsList[i].parentNode.parentNode.parentNode;
		//alert("g_paraId ="+paraNode.getAttribute("id")+" sId ="+sId +" procId ="+procId );
		var ttlNode = paraNode.parentNode;
		var paraTtlId = ttlNode.getAttribute("id");
		//alert("paraTtlId="+paraTtlId);
		if (ttlId != paraTtlId) {
			continue;
		}

		var paraXml = parent.initXml(paraNode.getAttribute("id")+".xml",false,false);
		//alert("paraXml="+paraNode.getAttribute("id")+".xml");
		if ( paraXml == null ) {
			alert("Relevant File "+paraNode.getAttribute("id")+".xml does not exist.");
			return;
		}
		objProc.input = paraXml;
		objProc.addParameter("No", sId);
		// 手順No.を表示しないため以下のパラメータを渡す
		objProc.addParameter("hasNum", "true");
		objProc.transform();
		dispPage += objProc.output;
	}
	if (dispPage == "") {
		alert("The applicable procedure has not been created. [Part ID:"+partId +"]");
		return;
	}

	//タイトルIDを元にタイトルの名称を取得する
	var ttlNote = parent.g_tocXml.selectSingleNode("//ttl[@id='"+ ttlId +"']");
	var ttlName = ttlNote.getElementsByTagName("name").item(0).nodeTypedValue;
	dispPage = "<p class='location'>"+ttlName+"</p>" + dispPage;

	//組み合わせる全部品ページを新しい画面で表示する
	parent.setDisplayArgs(new Array( dispPage));
	var ret  = parent.openDialog("singledisplay", s1Url);
	switch (ret) {
	//閉じる
	case "close":
		break;
	//印 刷
	case "print":
		parent.setDisplayArgs(new Array(g_illustId , dispPage, parent.sts.document.body.innerHTML));
		//組み合わせる全部品ページを印刷画面で表示する
		parent.openDialog("pdisplay", prtUrl);
		break;
	}
}

//
//  脱着　全体表示画面
//
function allDisplay() {
	var partId = parent.contents.getXMLSelectPartID();
	if( partId == null || partId == "" ){
		alert("Please select a part.");
		return;
	}
	var ttlIds  = getTitleIds( partId );
	if ( ttlIds.length == 0 ) {
		alert("The applicable procedure has not been created. [Part ID:"+partId +"]");
		return;
	} else if ( ttlIds.length == 1 ) {
		//タイトルID一つしかない場合は要領表示画面に飛ぶ
		parent.location.href="../rmv_ctt/frame.html"
			+ parent.getCttLink(g_paraId,g_illustId,g_termId,ttlIds[0],parent.g_tocXml)
			+ "&partId=" + partId;
		return;
	}

	// タイトルID選択ダイアログ表示
	var ret = selectTitleDialog(partId, ttlIds, true);
	if( ret == "close") return;

	//返す値はタイトルIDだ　要領画面で表示する
	parent.location.href="../rmv_ctt/frame.html"
		+ parent.getCttLink(g_paraId,g_illustId,g_termId,ret,parent.g_tocXml)
		+ "&partId=" + partId;
}

//
// タイトルID選択ダイアログ表示。
// タイトルが複数存在する場合はダイアログを表示し、ユーザに選択させる。
// 戻り値はタイトルIDだが、ユーザが操作を取り消した場合は "close" を返す。
//
function selectTitleDialog(partId, ttlIds, dispCount) {
	var ttlUrl = "ttl_frame.html";
	var ttlNames    = new Array();
	var ttlS1Counts = new Array();
	for (var i=0; i<ttlIds.length; i++) {
		//タイトルIDを元にタイトルの名称を取得する
		var ttlNote = parent.g_tocXml.selectSingleNode("//ttl[@id='"+ ttlIds[i] +"']");
		var ttlName = ttlNote.getElementsByTagName("name").item(0).nodeTypedValue;
		ttlNames.push(ttlName );

		// タイトル内の手順数をカウントする
		var s1 = g_procXml.selectNodes("//ttl[@id='"+ ttlIds[i] +"']/para[@category='A' ]/subpara/s-1");
		ttlS1Counts.push(s1.length); 
	}

	//手順数を昇順で表示する
	parent.sortOrder(ttlS1Counts ,ttlNames ,ttlIds);
	var partName = parent.getPartsName( partId );
	if (partName == null) {
		partName = "Cannot obtain part name [Part ID:"+partId+"]";
	}

	//取得する全部タイトルID、名称、手順数を新しい画面で表示する
	var args = new Array(ttlIds,ttlNames,ttlS1Counts,partName,dispCount);
	parent.setDisplayArgs( args );
	var ret  = parent.openDialog("alldisplay", ttlUrl);
	return ret;
}

// 
// 脱着　部品IDを元に親タイトルのIDsを取得する
// partId : 部品ID
//
function getTitleIds(partId) {
	var ret = new parent.Hashtable();

	//タイトル直下に部品ID完全一致のデータを探す
	var ttl = g_procXml.selectNodes("//ttl[para[@category='A']]/parts[@id='"+ partId +"']");
	if ( ttl.length != 0 ) {
		for (var i=0; i<ttl.length; i++) {
			id = ttl.item(i).parentNode.getAttribute("id");
			ret.put( id, id) ;
		}
		return ret.values();
	}
	//alert("一段階　タイトル直下に部品ID完全一致のデータを探す　なし");

	//所属するタイトルに手順含む部品ID完全一致のデータを探す
	ttl = g_procXml.selectNodes("//ttl[@id='"+ g_ttlId +"']/para[@category='A' ]/subpara/s-1/parts[@id='"+ partId +"']");
	if ( ttl.length != 0 ) {
		ret.put( g_ttlId , g_ttlId );
		return ret.values();
	}
	//alert("二段階　所属するタイトルに手順含む部品ID完全一致のデータを探す　なし");

	//全部タイトルに手順含む部品ID完全一致のデータを探す
	ttl = g_procXml.selectNodes("//ttl/para[@category='A' ]/subpara/s-1/parts[@id='"+ partId +"']");
	if ( ttl.length != 0 ) {
		for (var i=0; i<ttl.length; i++) {
			id = ttl.item(i).parentNode.parentNode.parentNode.parentNode.getAttribute("id");
			ret.put( id, id);
		}
		return ret.values();
	}
	//alert("三段階　全部タイトルに手順含む部品ID完全一致のデータを探す  なし");
	return new Array(0);
}


</script>
</head>
<body onLoad="init();">
</body>
</html>
