<!DOCTYPE html>
<!-- $Id: ttl_frame.html,v 1.12 2004/03/01 16:45:28 kato Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Title Selection</title>

<script language="javascript">
//
//  Contents画面の初期表示
//  初期化
//
function initContents() {
	var args = window.dialogArguments;
	if (args == null || args.length != 5) {
		alert("The parameter is invalid.");
		return;
	}

	var ttlIds      = args[0];
	var ttlNames    = args[1];
	var ttlS1Counts = args[2];
	var partName    = args[3];
	var dispCount   = args[4];

	if (ttlIds.length != ttlNames.length || ttlIds.length != ttlS1Counts.length) {
		alert("The number of parameters does not match.");
		return;
	}

	//alert( "  ttlIds.length="+ttlIds.length);
	var dispPage =  "";

	dispPage =  "<table border='1' width='100%' cellspacing='0' cellpadding='0' bordercolor='#FFFFFF'>"
		+ "<tr><th class='pointdisplaytitle' width='85%'><b>Title</b></th>";
	if (dispCount == true) {
		dispPage += "<th class='pointdisplaytitle' width='15%'><b>Number of Steps</b></th>";
	}
	dispPage += "</tr>";

	for (var i=0; i<ttlIds.length; i++) {
		dispPage += "<tr><td class='tbl-par'>"
			+ "<a class='tbl-para' href='#' onClick=returnValue='"+ttlIds[i]+"';parent.window.close();>"
			+  ttlNames[i] + "</a>";
		if (dispCount == true) {
			dispPage += "</td><td class='tbl-ttl' align=center>"+ttlS1Counts[i]+"</td>";
		}
		dispPage += "</tr>";
	}

	dispPage =  dispPage
		+ "</table>" 
		//+ "<BUTTON ONCLICK='window.alert(document.body.innerHTML);'>View</BUTTON>"
		;

	//alert("dispPage  ="+dispPage );
	contents.disp.innerHTML = dispPage ;
}
//
//  Global画面の初期表示
//  初期化
//
function initGlobal() {
	var args = window.dialogArguments;
	if (args == null || args.length != 5) {
		alert("The parameter is invalid.");
		return;
	}
	var ttlIds      = args[0];
	var ttlNames    = args[1];
	var ttlS1Counts = args[2];
	var partName    = args[3];
	var dispCount   = args[4];
	global.disp.innerText = partName;
	returnValue="close";
}
</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="ttl_global.html" scrolling="no" noresize frameborder="no">
	<frame name="contents" src="ttl_contents.html" frameborder="no">
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
