<!DOCTYPE html>
<!-- $Id: guide_global.html,v 1.17 2003/08/27 05:42:35 takeo Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Technical Description</title>

<link href="../../css/global.css" rel="stylesheet" type="text/css">
<script language="javascript">
var POPUP_WIDTH = 300;
var POPUP_OFFSET_X = 58;
var POPUP_OFFSET_Y = 22;
//解説書ポップアップobject
var ncfPopup = null;
//配線図ポップアップobject
var ewdPopup = null;
// 簡易ポップアップからフォーカスが外れた時にウィンドウを消すまでのタイムアウト時間
var DELAY_TIME = 2000;
// 簡易ポップアップを消す命令ID
var g_tid = null;
// 簡易ポップアップの消去フラグ
var g_clear = false;

function init(){
	if(parent.g_tocncfXml != null){
		if(parent.g_ncfUrlNodes.length == 0) {
			ncf.style.visibility="hidden";
		} else {
			ncf.style.visibility="visible";
			ncfurls.innerHTML = parent.g_dispNcfs;
		}
	}else {
		ncf.style.visibility="hidden";
	}
	if(parent.g_tocewdXml != null){
		if(parent.g_ewdUrlNodes.length == 0) {
			ewd.style.visibility="hidden";
		} else{
			ewd.style.visibility="visible";
			ewdurls.innerHTML = parent.g_dispEwds;
		}
	 }else {
		ewd.style.visibility="hidden";
	}
}

//解説書クリック時
function ncfDropDown() {
	if(parent.g_ncfUrlNodes.length >1){
		ncfPopup = window.createPopup();
		ncfPopup.document.body.onmouseover = clearDelay;
		ncfPopup.document.body.onmouseout = ncfSetDelay;
		ncfPopup.document.body.innerHTML = ncfContextHTML.innerHTML;
		var height;
		if(parent.g_ncfUrlNodes.length <= parent.SCROLL_ITEM_THRESHOLD){
			height = parent.ITEM_HEIGHT*parent.g_ncfUrlNodes.length;
		} else {
			height = parent.ITEM_HEIGHT*parent.SCROLL_ITEM_THRESHOLD;
		}
		height = height+parent.SCROLLBAR_MARGIN;
		ncfPopup.show(POPUP_OFFSET_X-10, POPUP_OFFSET_Y, POPUP_WIDTH, height, ncf);
	} else if(parent.g_ncfUrlNodes.length == 1) {
		win = window.open(parent.ncfUrlArray[0], "sias_ncf", "width=950, height=620, top=30, left=30, menubar=yes, status=yes, resizable=yes, scrollbars=yes");
		win.focus();
	}
}

//配線図集クリック時
function ewdDropDown() {
	if(parent.g_ewdUrlNodes.length >1){
		ewdPopup = window.createPopup();
		ewdPopup.document.body.onmouseover = clearDelay;
		ewdPopup.document.body.onmouseout = ewdSetDelay;
		ewdPopup.document.body.innerHTML = ewdContextHTML.innerHTML;
		var height;
		if(parent.g_ewdUrlNodes.length <= parent.SCROLL_ITEM_THRESHOLD){
			height = parent.ITEM_HEIGHT*parent.g_ewdUrlNodes.length;
		}else {
			height = parent.ITEM_HEIGHT*parent.SCROLL_ITEM_THRESHOLD;
		}
		height = height+parent.SCROLLBAR_MARGIN;
		ewdPopup.show(POPUP_OFFSET_X, POPUP_OFFSET_Y, POPUP_WIDTH, height, ewd);
	} else if(parent.g_ewdUrlNodes.length == 1) {
		win = window.open(parent.ewdUrlArray[0], "sias_ewd","width=950, height=620, top=30, left=30, toolbar=yes, status=yes, resizable=yes, scrollbars=yes");
		win.focus();
	}
}

// 指定時間後に解説書簡易ポップアップを消す設定をする
function ncfSetDelay() {
	g_tid = setTimeout("ncfUndispSubMenu()", DELAY_TIME);
	g_clear = false;
}
// 指定時間後に配線図集簡易ポップアップを消す設定をする
function ewdSetDelay() {
	g_tid = setTimeout("ewdUndispSubMenu()", DELAY_TIME);
	g_clear = false;
}
// 解説書簡易ポップアップを消す
function ncfUndispSubMenu() {
	ncfPopup.hide();
}
// 配線図簡易ポップアップを消す
function ewdUndispSubMenu() {
	ewdPopup.hide();
}
// 簡易ポップアップを消す設定を解除する
function clearDelay() {
	clearTimeout(g_tid);
	g_clear = true;
}			
</script>
</head>
<body class="subwindow" onload="init()">
<div id="ncfContextHTML" style="display:none;">
	<div id="ncfurls"></div>
</div>
<div id="ewdContextHTML" style="display:none;">
	<div id="ewdurls"></div>
</div>
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr><td></td></tr>
	<tr>
		<td align="center">
			<table width="98%" cellpadding="2" cellspacing="0" border="0">
				<tr>
					<td width="2"><br></td>
					<td align="left">
						<a class="subwindow-button" href="javascript:parent.framePrint(parent.contents)">
						  Execute Print
						</a>
					</td>
					<td id="ncf" align="center" style="visibility:hidden">
						<a class="subwindow-button" href="#"  onmousedown="ncfDropDown();" >
						 New Car Features
						</a>
					</td>
					<td id="ewd" align="center" style="visibility:hidden">
						<a class="subwindow-button" href="#" onmousedown="ewdDropDown();" >
						  Electrical Wiring Diagram
						</a>
					</td>
					<td align="right">
						<a class="subwindow-button" href="javascript:parent.window.close();">
						  Close
						</a>
					</td>
					<td width="2"><br></td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
