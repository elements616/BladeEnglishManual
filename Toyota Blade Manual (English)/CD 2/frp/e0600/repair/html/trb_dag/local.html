<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Diagnosis Procedure</title>


<link href="../../css/local.css" rel="stylesheet" type="text/css">
<script language="javascript">
function init() {
	if (parent.g_cttXml==null)
		return;

	if (parent.g_cttXml.selectNodes("//testgrp").length<1)
		return;

	// 最初の手順を表示する。
	if (parent.g_fsid==null) {
		parent.g_fsid = (parent.g_cttXml).selectSingleNode("//testgrp/@id");
		parent.g_lsid = parent.g_fsid.nodeTypedValue;
	}
	var h = new parent.Hashtable();
	h.put("testid", parent.g_fsid.nodeTypedValue);
	//h.put("testrs", "OK");
	// 全てを非表示として表示する。
	parent.display(parent.g_cttXml, parent.g_lclXsl, disp, h);
	parent.idPath = new Array();
	parent.rsPath = new Array();
}
</script>
</head>
<body onLoad="init();">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr><td class="text">Troubleshooting</td></tr>
	<tr><td><br/></td></tr>
</table>
<div id="disp"></div>
</body>
</html>
