<!DOCTYPE html>
<!-- $Id: scantool.html,v 1.16 2004/04/01 07:37:35 s-okino Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Diagnosis Procedure</title>

<link href="../../css/scantool.css" rel="stylesheet" type="text/css">
</head>

<script language="javascript">
var SEP_KEY = "=";
var SEP_VALUE = ",";
var SEP_BODY = "::";
var g_oToolCtrlId = "s"+ (new Date().getTime()) ;
var g_oToolCtrl;
var g_testId ;
var g_paraId;
var g_parameter;
var g_use = true;

function setTestId(id){
	if( g_use ) document.getElementById("Testbutton").disabled = false;
	if( id == null ) return;
	g_testId = id;
	var i = g_testId.indexOf("_");
	if( i == -1 ){
		alert("There is no applicable paragraph. [testId: " + g_testId + "]");
		return;
	}
	g_paraId = g_testId.substring(0,i).toLowerCase();

	var paraXml = parent.initXml("scantool_" + g_paraId + ".xml", false, false);
	if ( paraXml == null ) {
		alert("Relevant File " + "scantool_" + g_paraId + ".xml does not exist.");
		return;
	}
	g_parameter = getScantoolParameter(paraXml , g_testId );
	dispRun();
}

function getScantoolParameter(objXml, s1no) {
	var ret="testgrp-id" + SEP_KEY + s1no + SEP_VALUE;
	var nodes = objXml.documentElement.selectNodes("//testgrp[@id='" + s1no + "']/scantool//parameter");
	var keyvalue = null;
	for (i = 0; i < nodes.length; i++) {
		keyvalue = nodes[i].getAttributeNode("key").nodeTypedValue;
		ret += keyvalue;
		ret += SEP_KEY;
		ret += nodes[i].nodeTypedValue;
		if( keyvalue == "shori-type" ){
			ret += SEP_BODY;
		}else{
			ret += SEP_VALUE;
		}
	}

	if( keyvalue != "shori-type" ){
		ret = ret.substring(0, ret.length-1);
	}
	return ret;
}

function runTest(){
	// ツール連携オブジェクトを作成
	g_oToolCtrl = new ActiveXObject("AxPlug.ToolCopera.1");
	// ツール連携起動のメソッドの実行
	g_oToolCtrlId = "s"+ (new Date().getTime()) ;
	var text = g_oToolCtrl.AxStartExe(1, g_oToolCtrlId , g_parameter);
	//var text = g_oToolCtrl.AxStartExe(g_oToolCtrlId , g_parameter);
	if ( g_oToolCtrl.Result != 0 ) {
		alert("Failed to start the TaSCAN link object");
		return;
	}
	parent.addPlayTestId(g_testId);
}

function closeTest(){
	if( g_oToolCtrl == null ) return;
	// ツール連携メソッドの実行
	var text = g_oToolCtrl.AxStopExe(1, g_oToolCtrlId);
	//var text = g_oToolCtrl.AxStopExe(g_oToolCtrlId);
	if ( g_oToolCtrl.Result != 0 ) {
		alert("Failed to stop the TaSCAN link object");
		return;
	}
	g_oToolCtrl = null;
}

function init(){
	if(!parent.checkActiveX("AxPlug.ToolCopera.1","Please install the TaSCAN link object",false)){
		document.getElementById("Testbutton").disabled = true;
		g_use = false;
		return;
	}
}

function dispRun() {
	runArea.style.visibility="visible";
	runArea.style.display="inline";
	resultArea.style.visibility="hidden";
	resultArea.style.display="none";
}

function dispResult(result, lastid) {
	// grayout button
	// 過去履歴表示時：未実行 or 結果ファイルが存在しない場合、scanTool実行不可
	document.getElementById("Testbutton").disabled = true;
	if(g_testId == null || g_testId.length == 0) return;
	// 最終手順の場合は、scanTool実行可とする
	if( g_testId == lastid )
		document.getElementById("Testbutton").disabled = false;
	if(result   == null || result.length   == 0) return;

	resultArea.style.visibility="visible";
	resultArea.style.display="inline";
	runArea.style.visibility="hidden";
	runArea.style.display="none";

	resultArea.innerHTML = parent.getScanDispHtml(result);
}
</script>

<body onload=init() onunload=closeTest() >
  <div id="runArea">
	<table width="100%" border="1" cellspacing="0" cellpadding="0">
	  <tr>
		<td class="scantitle">TaSCAN Link</th>
	  </tr>
	  <tr>
		<td class="scanbody">
		  <br/><br/>
		  <p>Correctly connect the PC - TaSCAN - vehicle, check and perform the procedure below, and then click the Execute button.</p>
		  <form>
			<input type="button" id="Testbutton" value=" Execute " onclick=runTest()>
		  </form>
		  <br/><br/><br/><br/><br/><br/><br/>
		</td>
	  </tr>
	</table>
  </div>
  <div id="resultArea"  style="visibility: hidden; display: none"> </div>
</body>
</html>
