<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../../_runtime/legacy.css">
<script src="../../../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Repair Manual Contents</title>

<link href="../../css/contents.css" rel="stylesheet" type="text/css">
<script language="javascript">
//サービスデータID(セクションNo)
var g_serviceDataId = "10004";

//
//  コンテンツフレーム画面の初期表示
//
//
function init() {
	sctId = parent.findParameterValue("servcat" , location.search );
	if (sctId == null) {
		//alert("サービスカテゴリタイプIDが指定されていません");
		return;
	}
	var paraHash = new parent.Hashtable();
	paraHash.put("servcat_id",sctId);
	paraHash.put("dispmnt","false");
	paraHash.put("tablewidth","100%");
	var runXslObj = parent.g_listXsl;

	//SCT複数化対応　サービスデータの判定条件をSECTION_NOに変更
	//該当SCTIDノード配下の検索
	var sctNode = parent.g_tocXml.selectSingleNode("//servcat[@id='"+sctId+"']/section[starts-with(@id, '"+g_serviceDataId+"')]");
	
	//特別処理　サービスデータ場合は定期点検項目追加
	if( sctNode != null) runXslObj = parent.g_mntXsl ;

	parent.display(parent.g_tocXml, runXslObj, disp, paraHash);
	empty.style.display="inline";
}
</script>
</head>
<body onLoad="init();">
<div id="disp">
<table border="0" cellspacing="0" cellpadding="0" width="621" height="352">
	<tr>
		<td class="initial-display">
			<table width="520" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td class="gray5" width="380">Repair Manual</td>
					<td class="gray4" width="140">Contents List</td>
				</tr>
				<tr>
					<td colspan="2"> </td>
				</tr>
				<tr>
					<td class="text00" colspan="2">Select an item from the pull-down in the left menu.</td>
				</tr>
				<tr>
					<td colspan="2"> </td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</div>
<div id="empty" style="display:none">
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
	<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
</div>
</body>
</html>
