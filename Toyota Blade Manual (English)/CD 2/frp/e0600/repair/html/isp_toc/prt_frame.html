<title>[Electronic Technical Manual] - Print Inspection Illustrated Index</title>

<script src="../../js/util.js"></script>
<script language="javascript">
//
//  Contents画面の初期表示
//  初期化
//
function initContents() {
	var args = window.dialogArguments;
	if (args == null || args.length != 2) {
		alert("The parameter is invalid.");
		return;
	}
	var illustId = args[0];
	if (illustId == null) {
		alert("There is no illustration ID.");
		return;
	}
	contents.png.innerHTML="<img src='../../png/"+illustId.toLowerCase() +".png' width='100%' alt='" + illustId + "'></img>"
		//+ "<BUTTON ONCLICK='window.alert(document.body.innerHTML);'>View</BUTTON>"
		;
	contents.svgTitle.innerHTML = illustId;
	contents.ttl.innerHTML = args[1];
}
</script>
</head>

</frameset>
