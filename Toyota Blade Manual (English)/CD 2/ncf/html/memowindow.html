<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../_runtime/legacy.css">
<script src="../../../_runtime/compat.js"></script>

<title>Memo Screen</title>
<script language="javascript" src="../js/memo.js"></script>
<style type="text/css">
<!--
td.gray{
	font-weight:bold;	text-align:center;
	color:#FFFFFF;	background-color:gray;
}
-->
</style>
</head>
<body onload="ReadFile()" style="text-align:center;">
<form name="frmFile">
<table border="0" cellpadding="0" cellspacing="0" width="100%"><tr><td class="gray" id="memoTitle"></td></tr></table>
<p style="text-align:right;width:90%">
<input type="hidden" name="filename">
<input type="hidden" name="Title">
<textarea style="width:100%" rows="8" name="memo">
</textarea><br>
<input type="button" value="Save" onClick="WriteFile()" style="width:90px">
<input type="button" value="Cancel" onClick="window.close()" style="width:90px">
<!--
<input type="button" value="alert" onClick="alert(document.getElementById('memoTitle').innerText)" style="width:90px">
-->
</form>
</body>
</html>
