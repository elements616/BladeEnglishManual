<!DOCTYPE html>
<!-- $Id: local.html,v 1.9 2003/10/06 08:23:52 takeo Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Symptom</title>


<script language="javascript">
function init() {
  var isInitial=true;
	for (var i=parent.g_startPos; i<=parent.g_endPos; i++) {
		if (i==parent.g_startPos) {
			var areaNode = parent.g_listXml.selectSingleNode("//table["+parent.g_tblId+"]//tbody/row["+i+"]/entry[1]");
			sym.innerHTML=(areaNode!=null) ? areaNode.nodeTypedValue : "";
		}
		var args = new parent.Hashtable();
		args.put("rowpos", i);
		args.put("tbl", parent.g_tblId);
		
		parent.iterateDisplay(parent.g_listXml, parent.g_localXsl, disp, args, isInitial);
		isInitial=false;
	}
	var refId = (parent.g_refId).substring((parent.g_refId).search("_")+1, parent.g_refId.length);
	parent.changeMode(document.getElementById(refId));
}
</script>
<link href="../../css/local.css" rel="stylesheet" type="text/css">
</head>
<body onLoad="init()">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr>
		<td class="text">Troubleshooting</td>
	</tr>
	<tr>
		<td>
			<br/>
			<p id="sym" class="gentext"></p>
			<ol class="symptom"><div id="disp"></div></ol>
		</td>
	</tr>
</table>
</body>
</html>
