<html lang="en">
<head>
<meta charset="utf-8">

<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Symptom</title>

<link href="../../css/status.css" rel="stylesheet" type="text/css">

<script language="javascript">
function init() {
	var ttlName = (parent.g_listXml).selectSingleNode("//ttl/name").nodeTypedValue;
	var symName = parent.g_listXml.selectSingleNode("//table["+parent.g_tblId+"]//tbody/row["+parent.g_startPos+"]/entry[1]/ptxt").nodeTypedValue;
	disp.innerHTML = "<p class='location'>" + ttlName + " ／ " + symName + "</p>";
}
</script>
</head>
<body onLoad="init()">
	<div id="disp"></div>
</body>
