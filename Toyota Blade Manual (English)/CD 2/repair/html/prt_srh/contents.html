<script language="javascript">
//
//  新規ウィンドウで表示
//
function openWindow( url , name , termId ) {
	var openUrl = "";
	if ( url.indexOf('?')>0 ){
		openUrl = "../../../"+name+"/"+url+"&term="+termId;
	}else{
		openUrl = "../../../"+name+"/"+url+"?term="+termId;
	}
	parent.openNewWindow(openUrl ,name );
}

// 初期処理
function init() {
	hideMessage();
	parent.initReplaceKey();
}

// 検索中の待機メッセージを消す
function hideMessage() {
	var msg = this.document.all('msg');
	msg.style.display     = "none";
	tab.style.display     = "inline";
	disp.style.display    = "inline";
	dispncf.style.display = "inline";
	dispewd.style.display = "inline";
	dispfrp.style.display = "inline";
}

// 検索中の待機メッセージを表示する
function dispMessage() {
	var msg = this.document.all('msg');
	msg.style.display     = "inline";
	tab.style.display     = "none";
	disp.style.display    = "none";
	dispncf.style.display = "none";
	dispewd.style.display = "none";
	dispfrp.style.display = "none";
}

// タブ切替え
function changeTab(catcd) {
	parent.g_catcd = catcd;
	parent.clearPageNum();
	changeTabColorAndText();
	// All表示
	if (catcd == 0) {
		disp.innerHTML = parent.getDispRetHTMLForAll(1);
		dispncf.innerHTML = parent.getDispRetHTMLForAll(2);
		dispewd.innerHTML = parent.getDispRetHTMLForAll(3);
		dispfrp.innerHTML = parent.getDispRetHTMLForAll(4);
		return;
	}
	// 個別表示
	var ret = parent.getDispRetHTML(parent.g_pageNum, parent.g_catcd);
	disp.innerHTML = ret;
	dispncf.innerHTML = "";
	dispewd.innerHTML = "";
	dispfrp.innerHTML = "";
}

// 次のページを表示
function displayNext() {
	parent.g_pageNum++;
	var ret = parent.getDispRetHTML(parent.g_pageNum, parent.g_catcd);
	disp.innerHTML = ret;
}

// 前のページを表示
function displayPrev() {
	parent.g_pageNum--;
	var ret = parent.getDispRetHTML(parent.g_pageNum, parent.g_catcd);
	disp.innerHTML = ret;
}

var COL_TAB_BASE = "#c9c9c9";
var COL_TAB_SELC = "#f7f9f9";
var COL_DARK_SPC = "#666666";
var COL_PALE_SPC = "#999966";
var TAB_TXT_ALL  = "ALL";
var TAB_TXT_RPR  = "Repair Manual";
var TAB_TXT_NCF  = "New Car Features";
var TAB_TXT_EWD  = "Electrical Wiring Diagram";
var TAB_TXT_FRP  = "Function-Specific Repair Manual";

function changeTabColorAndText() {
	tab.innerHTML = "<table class='tab' border='0' width='100%' cellSpacing='0' cellPadding='0'>" +
						"<tr class='tab' height='3'><td class='tabbase' colspan='19' height='3'></td></tr>" +
						"<tr class='tab'>" +
							"<td height='2' class='tabbase' colspan='1'></td>" +
							"<td height='2' colspan='3' id='tabtop_all'></td> <td height='2' colspan='2' id='tabtop_a_r'></td>" +
							"<td height='2' colspan='1' id='tabtop_rpr'></td> <td height='2' colspan='2' id='tabtop_r_c'></td>" +
							"<td height='2' colspan='1' id='tabtop_ncf'></td> <td height='2' colspan='2' id='tabtop_n_e'></td>" +
							"<td height='2' colspan='1' id='tabtop_ewd'></td> <td height='2' colspan='2' id='tabtop_e_f'></td>" +
							"<td height='2' colspan='3' id='tabtop_frp'></td>" +
							"<td height='2' class='tabbase' colspan='1'></td>" +
						"</tr>" +
						"<tr class='tab'>" +
							"<td class='tabbase' width='1'></td>" +
							"<td width='1' id='tab_all1'></td>" +
							"<td width='1' id='tab_all2'></td>" +
							"<td class='tabtarget' width='150' id='tab_all'><div id='tablk_all'></div></td>" +
							"<td width='1' id='tab_a_r1'></td>" +
							"<td width='1' id='tab_a_r2'></td>" +
							"<td class='tabtarget' width='150' id='tab_rpr'><div id='tablk_rpr'></div></td>" +
							"<td width='1' id='tab_r_n1'></td>" +
							"<td width='1' id='tab_r_n2'></td>" +
							"<td class='tabtarget' width='150' id='tab_ncf'><div id='tablk_ncf'></div></td>" +
							"<td width='1' id='tab_n_e1'></td>" +
							"<td width='1' id='tab_n_e2'></td>" +
							"<td class='tabtarget' width='150' id='tab_ewd'><div id='tablk_ewd'></div></td>" +
							"<td width='1' id='tab_e_f1'></td>" +
							"<td width='1' id='tab_e_f2'></td>" +
							"<td class='tabtarget' width='150' id='tab_frp'><div id='tablk_frp'></div></td>" +
							"<td width='1' id='tab_frp1'></td>" +
							"<td width='1' id='tab_frp2'></td>" +
							"<td class='tabbase' width='1'></td>" +
						"</tr>" +
						"<tr class='tab'>" +
							"<td class='tab-dark-spacer' height='2' colspan='3'></td>" +
							"<td height='2' colspan='3' id='tabbs_all'></td>" +
							"<td height='2' colspan='3' id='tabbs_rpr'></td>" +
							"<td height='2' colspan='3' id='tabbs_ncf'></td>" +
							"<td height='2' colspan='3' id='tabbs_ewd'></td>" +
							"<td height='2' colspan='3' id='tabbs_frp'></td>" +
							"<td class='tab-dark-spacer' height='2' colspan='1'></td>" +
						"</tr>" +
						"<tr height='8'><td/></tr>" +
					"</table>";
	initTabColorAndText();
	// ALLタブ選択
	if (parent.g_catcd == 0) {
		tabtop_all.bgColor  = COL_DARK_SPC;
		tabtop_a_r.bgColor  = COL_DARK_SPC;
		tab_all1.bgColor    = COL_DARK_SPC;
		tab_all2.bgColor    = COL_DARK_SPC
		tab_all.bgColor     = COL_TAB_SELC;
		tab_a_r1.bgColor    = COL_TAB_SELC;
		tab_a_r2.bgColor    = COL_DARK_SPC;
		tabbs_all.bgColor   = COL_TAB_SELC;
		tablk_all.innerText = TAB_TXT_ALL;
	// 修理書タブ選択
	} else if (parent.g_catcd == 1) {
		tabtop_a_r.bgColor  = COL_DARK_SPC;
		tabtop_rpr.bgColor  = COL_DARK_SPC;
		tabtop_r_c.bgColor  = COL_DARK_SPC;
		tab_a_r1.bgColor    = COL_DARK_SPC;
		tab_a_r2.bgColor    = COL_DARK_SPC;
		tab_rpr.bgColor     = COL_TAB_SELC;
		tab_r_n1.bgColor    = COL_TAB_SELC;
		tab_r_n2.bgColor    = COL_DARK_SPC;
		tabbs_rpr.bgColor   = COL_TAB_SELC;
		tablk_rpr.innerText = TAB_TXT_RPR;
	// 解説書タブ選択
	} else if (parent.g_catcd == 2) {
		tabtop_r_c.bgColor  = COL_DARK_SPC;
		tabtop_ncf.bgColor  = COL_DARK_SPC;
		tabtop_n_e.bgColor  = COL_DARK_SPC;
		tab_r_n1.bgColor    = COL_DARK_SPC;
		tab_r_n2.bgColor    = COL_DARK_SPC;
		tab_ncf.bgColor     = COL_TAB_SELC;
		tab_n_e1.bgColor    = COL_TAB_SELC;
		tab_n_e2.bgColor    = COL_DARK_SPC;
		tabbs_ncf.bgColor   = COL_TAB_SELC;
		tablk_ncf.innerText = TAB_TXT_NCF;
	// 配線図集タブ選択
	} else if (parent.g_catcd == 3) {
		tabtop_n_e.bgColor  = COL_DARK_SPC;
		tabtop_ewd.bgColor  = COL_DARK_SPC;
		tabtop_e_f.bgColor  = COL_DARK_SPC;
		tab_n_e1.bgColor    = COL_DARK_SPC;
		tab_n_e2.bgColor    = COL_DARK_SPC;
		tab_ewd.bgColor     = COL_TAB_SELC;
		tab_e_f1.bgColor    = COL_TAB_SELC;
		tab_e_f2.bgColor    = COL_DARK_SPC;
		tabbs_ewd.bgColor   = COL_TAB_SELC;
		tablk_ewd.innerText = TAB_TXT_EWD;
	// 機能別修理書タブ選択
	} else if (parent.g_catcd == 4) {
		tabtop_e_f.bgColor  = COL_DARK_SPC;
		tabtop_frp.bgColor  = COL_DARK_SPC;
		tab_e_f1.bgColor    = COL_DARK_SPC;
		tab_e_f2.bgColor    = COL_DARK_SPC;
		tab_frp.bgColor     = COL_TAB_SELC;
		tab_frp1.bgColor    = COL_TAB_SELC;
		tab_frp2.bgColor    = COL_DARK_SPC;
		tabbs_frp.bgColor   = COL_TAB_SELC;
		tablk_frp.innerText = TAB_TXT_FRP;
	}
}

function initTabColorAndText(){
	tabtop_all.bgColor = COL_TAB_BASE;
	tabtop_a_r.bgColor = COL_TAB_BASE;
	tabtop_rpr.bgColor = COL_TAB_BASE;
	tabtop_r_c.bgColor = COL_TAB_BASE;
	tabtop_ncf.bgColor = COL_TAB_BASE;
	tabtop_n_e.bgColor = COL_TAB_BASE;
	tabtop_ewd.bgColor = COL_TAB_BASE;
	tabtop_e_f.bgColor = COL_TAB_BASE;
	tabtop_frp.bgColor = COL_TAB_BASE;

	// キー入力検索
	if (parent.g_searchFlg == 1) {
		tab_all1.bgColor = COL_TAB_BASE;
		tab_all2.bgColor = COL_PALE_SPC
		tab_all.bgColor  = COL_TAB_BASE;
		tablk_all.innerHTML = "<a href='#' onmousedown='changeTab(0)' class='tablink'>" + TAB_TXT_ALL + "</a>";
		tab_a_r1.bgColor = COL_TAB_BASE;
		tab_a_r2.bgColor = COL_PALE_SPC;
		tab_rpr.bgColor  = COL_TAB_BASE;
		tablk_rpr.innerHTML = "<a href='#' onmousedown='changeTab(1)' class='tablink'>" + TAB_TXT_RPR + "</a>";
		tab_r_n1.bgColor = COL_TAB_BASE;
		tab_r_n2.bgColor = COL_PALE_SPC;
		tab_ncf.bgColor  = COL_TAB_BASE;
		tablk_ncf.innerHTML = "<a href='#' onmousedown='changeTab(2)' class='tablink'>" + TAB_TXT_NCF + "</a>";
		tab_n_e1.bgColor = COL_TAB_BASE;
		tab_n_e2.bgColor = COL_PALE_SPC;
		tab_ewd.bgColor  = COL_TAB_BASE;
		tablk_ewd.innerHTML = "<a href='#' onmousedown='changeTab(3)' class='tablink'>" + TAB_TXT_EWD + "</a>";
		tab_e_f1.bgColor = COL_TAB_BASE;
		tab_e_f2.bgColor = COL_PALE_SPC;
		tab_frp.bgColor  = COL_TAB_BASE;
		tablk_frp.innerHTML = "<a href='#' onmousedown='changeTab(4)' class='tablink'>" + TAB_TXT_FRP + "</a>";
		tab_frp1.bgColor = COL_TAB_BASE;
		tab_frp2.bgColor = COL_PALE_SPC;
		tabbs_all.bgColor = COL_DARK_SPC;
		tabbs_rpr.bgColor = COL_DARK_SPC;
		tabbs_ncf.bgColor = COL_DARK_SPC;
		tabbs_ewd.bgColor = COL_DARK_SPC;
		tabbs_frp.bgColor = COL_DARK_SPC;
	// リストボックス検索
	} else {
		tab_all1.bgColor = COL_TAB_BASE;
		tab_all2.bgColor = COL_TAB_BASE
		tab_all.bgColor  = COL_TAB_BASE;
		tablk_all.innerHTML = "<a href='#' onmousedown='changeTab(0)' class='tablink'>" + TAB_TXT_ALL + "</a>";
		tab_a_r1.bgColor = COL_TAB_BASE;
		tab_a_r2.bgColor = COL_TAB_BASE;
		tab_rpr.bgColor  = COL_TAB_BASE;
		tablk_rpr.innerHTML = "<a/>";
		tab_r_n1.bgColor = COL_TAB_BASE;
		tab_r_n2.bgColor = COL_TAB_BASE;
		tab_ncf.bgColor  = COL_TAB_BASE;
		tablk_ncf.innerHTML = "<a/>";
		tab_n_e1.bgColor = COL_TAB_BASE;
		tab_n_e2.bgColor = COL_TAB_BASE;
		tab_ewd.bgColor  = COL_TAB_BASE;
		tablk_ewd.innerHTML = "<a/>";
		tab_e_f1.bgColor = COL_TAB_BASE;
		tab_e_f2.bgColor = COL_TAB_BASE;
		tab_frp.bgColor  = COL_TAB_BASE;
		tablk_frp.innerHTML = "<a/>";
		tab_frp1.bgColor = COL_TAB_BASE;
		tab_frp2.bgColor = COL_TAB_BASE;
		tabbs_all.bgColor = COL_DARK_SPC;
		tabbs_rpr.bgColor = COL_DARK_SPC;
		tabbs_ncf.bgColor = COL_DARK_SPC;
		tabbs_ewd.bgColor = COL_DARK_SPC;
		tabbs_frp.bgColor = COL_DARK_SPC;
	}
}
</script>
