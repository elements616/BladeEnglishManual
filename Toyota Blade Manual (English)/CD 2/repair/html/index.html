// 適用期間選択セレクトボックスを表示する
function getPublishDateList() {
	var hash = new Hashtable();
	var termList = new Array();
	var objXml;

	//三つファイルから日付データを取得する
	objXml = initXml(EWD_XML, true, false);
	if ( objXml != null) {
	  termList = objXml.getElementsByTagName("term");
	}
	for (var i=0; i<termList.length; i++) {
		var date = termList.item(i).getAttribute("date");
		var code = termList.item(i).nodeTypedValue;
		//取得したデータはHashTableに格納する
		hash.put(date , code );
	}
	termList = new Array();
	objXml = initXml(NCF_XML, true, false);
	if ( objXml != null) {
	  termList = objXml.getElementsByTagName("term");
	}
	for (var i=0; i<termList.length; i++) {
		var date = termList.item(i).getAttribute("date");
		var code = termList.item(i).nodeTypedValue;
		//取得したデータはHashTableに格納する
		hash.put(date , code );
	}
	termList = new Array();
	objXml = initXml(PUB_XML);
	if ( objXml != null) {
	  termList = objXml.getElementsByTagName("term");
	}
	for (var i=0; i<termList.length; i++) {
		var date = termList.item(i).getAttribute("date");
		var code = termList.item(i).nodeTypedValue;
		//取得したデータはHashTableに格納する
		hash.put(date , code );
	}
	//データのソードキーを取る
	var sortKey = hash.keys();
	sortKey.sort();
	var ret = "<span class='term'>Release Date<br></span>";
	ret += "<select id='term' size='7'>";
	if (sortKey.length>1) {
		ret += "<option value=''>▼ Please select</option>"
	}
	for (var i=0; i<sortKey.length; i++) {
		var date = sortKey[i];
		var code = hash.get(date);
		var year_month = date.substring(0,4)+"/"+date.substring(4,6);
		ret += "<option value='" + date +"'>" + year_month + " " + code + "</option>";
	}
	ret += "</select>";
	document.getElementById("opt").innerHTML = ret;
	//alert(ret);
}

// 適用期間選択セレクトボックスの初期選択状態を設定する
function presetPublishDateList() {
//	// 適用時期が１つの場合、それをデフォルト選択状態にする
	var selectObj  =  document.getElementById("term");
//	if (selectObj.options.length == 2) {
//	  selectObj.options[1].selected = true;
//	  return;
//	}
	var termVal = getParameterValue("term");
	if (termVal ==null || termVal =="null" ) {
		termVal =="";
	}
	for(i=0;i<selectObj.options.length;i++){
		if(selectObj.options[i].value == termVal ){
			selectObj.options[i].selected = true;
			return;
		}
	}
	// 初期表示では先頭データを選択状態にする
	selectObj.options[0].selected = true;
	return;
}

// 適用時期の選択状態をチェックし、未選択の場合アラート表示、選択済みなら指定URLへ遷移する
//  url:   適用時期を追加するURL
function chkTermValue(url) {
	var termElem = document.getElementById("term");
	if (termElem==null) {
		document.location.href=url;
		return;
	}
	tv = termElem.value;
	if (tv==null || !/^\d{6}$/.test(tv)) {
		__modalNotice("Please select a release date first.");
	} else {
		setTermValue(url, tv);
	}
	return;
}

// 画像のpreloadを行う
function preloadImage() {
	var typeCount = preloadImage.arguments;
	g_imageArray = new Array();
	for (var i=0; i<typeCount.length; i++) {
		g_imageArray[i] = _getImageArray(typeCount[i]);
	}
}
function _getImageArray(imageName) {
	var imgs = new Array();
	for (i=0; i<=IDX_MOUSE_DOWN; i++) {
		imgs[i] = new Image();
		imgs[i].src = "../img/" + imageName + i + ".png";
	}
	return imgs;
}
function _setImage(event, idx, iname) {
	if (g_imageArray==null) return;
	var imgs = g_imageArray[idx]
	document.images[iname].src=imgs[event].src;
}
function mouseOverImage(iname) {
	var idx = iname.substring(1, iname.length);
	_setImage(IDX_MOUSE_OVER, eval(idx), iname);
}
function mouseOutImage(iname) {
	var idx = iname.substring(1, iname.length);
	_setImage(IDX_NORMAL, eval(idx), iname);
}
function mouseDownImage(iname) {
	var idx = iname.substring(1, iname.length);
	_setImage(IDX_MOUSE_DOWN, eval(idx), iname);
}

// XMLファイルのプリロード
function loadData() {
	if( isHttpProtocol() ) {
//var start = new Date();
		for( i=0;i<PRELOAD_XML.length;i++){
			if (i==0) TOC_XML = initXml(PRELOAD_XML[i],false,false);
			else initXml(PRELOAD_XML[i], false, false);
		}
//var end = new Date();
//alert("XMLファイルプリロード時間：["+(end-start)+"ms]");
	} else {
		TOC_XML = initXml(PRELOAD_XML[0], false, false);
	}
}

// 初期化処理
function init() {
	//if(!checkSoftware()) return;
	getPublishDateList();
	presetPublishDateList();
	preloadImage('t_rmv', 't_isp', 't_trb', 't_koz', 't_sob', 't_tok', 't_sys', 't_con', 't_eqp', 't_mnt', 't_toc', 't_prt');
	loadData();
}
