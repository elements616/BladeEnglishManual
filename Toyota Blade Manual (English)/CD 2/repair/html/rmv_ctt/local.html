//local.htmlでパラグラフ変更リンクclick時
function changeParagraph(paragraphId){
	parent.g_nowObjXml = null ;//※パラグラフを切り替えるたびにg_nowObjXml=nullにする。
	parent.g_s1Id = null;
	parent.g_category = parent.g_tocXml.selectSingleNode("//para[@id='"+paragraphId+"']").getAttribute("category");
	if (parent.g_category=="A") {
		g_locXsl = parent.initXsl("../../xsl/rmv/local.xsl");
	} else if (parent.g_category=="F"||parent.g_category=="L"||parent.g_category=="D"||parent.g_category=="U") {
		g_locXsl = parent.initXsl("../../xsl/rmv/gen_local.xsl");
	} else if (parent.g_category=="M"||parent.g_category=="N") {
		g_locXsl = parent.initXsl("../../xsl/rmv/local.xsl");
	} else if (parent.g_category=="G") {
		g_locXsl = parent.initXsl("../../xsl/rmv/isp_local.xsl");
	}

	//(initContents()での場合わけの為：localDisplayで作られているか、前のパラグラフで作られたg_nowObjXmlか判別）
	parent.g_nowParagraphId = paragraphId;
	parent.local.localDisplay();
	parent.sts.initStatus();
	parent.contents.initContents();
	parent.global.enabledPreparation();
}

//local.html「要領」で手順変更リンクclick時
var g_hash = new parent.Hashtable();
function selectId(id){
	parent.g_nowTitleId = id;//構成図のために必要。
	g_hash.put("No", id);
	if(parent.g_flag==0 && parent.g_category=="A") {
		parent.display(parent.g_nowObjXml,parent.g_nowContXsl,parent.contents.disp,g_hash);
		parent.contents.location.hash = "TOP";
	} else if(parent.g_flag==1 || parent.g_category=="M" || parent.g_category=="N") {
		parent.contents.location.hash = id;//through表示のアンカー指定。
	}
	parent.loadMemoData (parent.contents.document,parent.REPAIR);
	// クリック後の点々の残りカス対策
	parent.contents.focus();
	parent.g_s1Id = id;	
}
//local.html「点検」でタイトルclick時
function selectTop(){
	parent.contents.location.hash = "TOP";
	// クリック後の点々の残りカス対策
	parent.contents.focus();
}
//初期表示時に利用：第1<s-1>id値を取得
function getFirstId(objXml){
	if (parent.g_s1Id != null) {
		return parent.g_s1Id;
	}
	if (objXml == null) return null;
	var nodes = objXml.selectNodes("//s-1");
	if ((nodes != null) && (nodes.length > 0)) {
		return nodes.item(0).getAttribute("id");
	} else {
		return null;
	}
}
//初期表示時に利用：第1<ttl>id値を取得(カテゴリG)
function getFirstTtlId(objXml){
	var nodes = objXml.selectNodes("//ttl");
	if ((nodes != null) && (nodes.length > 0)) {
		return nodes.item(0).getAttribute("id");
	} else {
		return null;
	}
}
//初期表示時に利用：第1リスト(<a>)を取得(カテゴリF,L,D,U)
function getFirstItem(){
	var olList = this.document.getElementsByTagName("ol");
	if (olList.length > 0) {
		return olList.item(0).getElementsByTagName("a").item(0);
	} else {
		return null;
	}
}
