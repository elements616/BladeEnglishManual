<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Print Removal/Installation Procedure Run-through</title>

<link href="../../css/global.css" rel="stylesheet" type="text/css">
</head>
<body class="subwindow">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr><td></td></tr>
	<tr>
		<td align="center">
			<table width="98%" cellpadding="2" cellspacing="0" border="0">
				<tr>
					<td width="2"><br></td>
					<td align="left">
						<a id="confirm" class="subwindow-button" href="javascript:parent.printConfirm(parent.contents.document, parent.global.document)">
						  Print Confirmation
						</a>
						<a id="print" class="subwindow-button" href="javascript:parent.framePrint(parent.contents)" style="visibility: hidden; position:absolute; display:none;">
						  Execute Print
						</a>
					</td>
					<td align="center">
						<a id="selectall" class="subwindow-button" href="javascript:parent.allSelect(parent.contents.document.f1, true)">Select All</a>
						<a id="selectnone" class="subwindow-button" href="javascript:parent.allSelect(parent.contents.document.f1, false)">Deselect All</a>
					</td>
					<td align="right">
						<a class="subwindow-button" href="javascript:parent.window.close();">
						  Close
						</a>
					</td>
					<td width="2"><br></td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
