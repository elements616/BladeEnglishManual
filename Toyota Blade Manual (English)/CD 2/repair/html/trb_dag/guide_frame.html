<!DOCTYPE html>
<!-- $Id: guide_frame.html,v 1.21 2003/10/20 09:52:00 takeo Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Technical Description</title>

<script src="../../js/xml.js"></script>
<script src="../../js/util.js"></script>
<script src="../../js/hashtable.js"></script>
<script src="../../js/dom.js"></script>
<script src="../../js/style.js"></script>
<script language="javascript">
var SCROLL_ITEM_THRESHOLD = 5;
var SCROLLBAR_MARGIN = 16;
var ITEM_HEIGHT = 25;
var g_dispNcfs;
var g_dispEwds;
var g_ncfUrlNodes;
var g_ewdUrlNodes;
//var g_objXml = window.dialogArguments;
var args = window.dialogArguments;
var g_objXml = args[0];
var g_term = args[1];
var g_titleName = "";
var g_sectionName = "";
var g_queryFromTo   = "(@from <= "+g_term+" and "+g_term+" < @to)";
var g_queryFromOnly = "(@from <= "+g_term+" and (@to='' or not(@to)))";
var g_queryToOnly   = "((@from='' or not(@from)) and "+g_term+" < @to)";
var g_queryNone     = "((@from='' or not(@from)) and (@to='' or not(@to)))";

if (g_objXml != null) {
  g_titleName = g_objXml.selectSingleNode("//ttl/name").nodeTypedValue;
  g_sectionName = g_objXml.selectSingleNode("//section/name").nodeTypedValue;
}

//解説書ncf
var g_tocncfXml = initXml("../../../ncf/toc_ncf.xml",true,false);
if(g_tocncfXml != null){
	g_tocncfXml.setProperty("SelectionLanguage", "XPath");
	g_ncfUrlNodes = g_tocncfXml.selectNodes("//para[child::system-name[node()='"+ g_titleName +"'] and ("+g_queryFromTo+" or "+g_queryFromOnly+" or "+g_queryToOnly+" or "+g_queryNone+")]");
	if(g_ncfUrlNodes.length != 0){
		var ncfUrlArray = new Array();
		var ncfNameArray = new Array();
		var height;
		if(g_ncfUrlNodes.length <= SCROLL_ITEM_THRESHOLD){
			height = ITEM_HEIGHT*g_ncfUrlNodes.length;
		}else {
			height = ITEM_HEIGHT*SCROLL_ITEM_THRESHOLD;
		}
		height = height + parent.SCROLLBAR_MARGIN;
		g_dispNcfs="<div style=\"position:absolute; top:0; left:0; overflow-y: auto; overflow-x: auto; width:300; height:"+height+"; background-color:#f7f9f9; border: 1px solid #c0c0c0\">";
		for(i=0;i<g_ncfUrlNodes.length;i++){
			if(g_ncfUrlNodes.item(i).selectSingleNode("name")==null){
				ncfUrlArray[i] = "../../../ncf/"+g_ncfUrlNodes.item(i).selectSingleNode("ancestor::section").getAttribute("url");
				ncfUrlArray[i] += (ncfUrlArray[i].indexOf("?")==-1) 
												? ("?term=" + g_term)
												: ("&term=" + g_term);
				ncfNameArray[i] = g_ncfUrlNodes.item(i).selectSingleNode("ancestor::section/name").nodeTypedValue;
			} else{
				ncfUrlArray[i] = "../../../ncf/"+g_ncfUrlNodes.item(i).getAttribute("url");
				ncfUrlArray[i] += (ncfUrlArray[i].indexOf("?")==-1) 
												? ("?term=" + g_term)
												: ("&term=" + g_term);
				ncfNameArray[i] = g_ncfUrlNodes.item(i).selectSingleNode("name").nodeTypedValue;
			}
			var dispNcf ="<div onmouseover=\"this.style.backgroundColor='#dfffff';\" onmouseout=\"this.style.backgroundColor='#f7f9f9';\" style=\"font-family:sans-serif; font-size:70%; height:"+ITEM_HEIGHT+"px; background:#f7f9f9; border:1px solid #c0c0c0; padding:3px; padding-left:20px;  cursor:hand; filter:;\"><span onclick=\"parent.window.open('"+ncfUrlArray[i]+"','New Car Features','width=950, height=620, top=30, left=30, menubar=yes, status=yes, resizable=yes, scrollbars=yes')\\\">"+ncfNameArray[i]+"</span></div>"
			g_dispNcfs += dispNcf;
		}
		g_dispNcfs +="</div>";
//alert(g_dispNcfs);
	}
}

//配線図集ewd
var g_tocewdXml = initXml("../../../ewd/toc_ewd.xml",true,false);
if(g_tocewdXml != null){
	g_tocewdXml.setProperty("SelectionLanguage", "XPath");
	var g_ewdUrlNodes = g_tocewdXml.selectNodes("//para[child::system-name[node()='"+ g_titleName +"'] and ("+g_queryFromTo+" or "+g_queryFromOnly+" or "+g_queryToOnly+" or "+g_queryNone+")]");
	if(g_ewdUrlNodes.length != 0){
		var ewdUrlArray = new Array();
		var ewdNameArray = new Array();
		var height;
		if(g_ewdUrlNodes.length <= SCROLL_ITEM_THRESHOLD){
			height = ITEM_HEIGHT*g_ewdUrlNodes.length;
		}else {
			height = SCROLL_ITEM_THRESHOLD*ITEM_HEIGHT;
		}
		height = height + parent.SCROLLBAR_MARGIN;
		g_dispEwds="<div style=\"position:absolute; top:0; left:0; overflow-y: auto; overflow-x:auto; width:300; height:"+height+"; background-color:#f7f9f9; border: 1px solid #c0c0c0\">";
		for(i=0;i<g_ewdUrlNodes.length;i++){
			if(g_ewdUrlNodes.item(i).selectSingleNode("name")==null){
				ewdUrlArray[i] = "../../../ewd/"+g_ewdUrlNodes.item(i).selectSingleNode("ancestor::section").getAttribute("url");
				ewdUrlArray[i] += (ewdUrlArray[i].indexOf("?")==-1) 
												?	("?term=" + g_term)
												: ("&term=" + g_term);
				ewdNameArray[i] = g_ewdUrlNodes.item(i).selectSingleNode("ancestor::section/name").nodeTypedValue;
			} else{
				ewdUrlArray[i] = "../../../ewd/"+g_ewdUrlNodes.item(i).getAttribute("url");
				ewdUrlArray[i] += (ewdUrlArray[i].indexOf("?")==-1)
				                ?	("?term=" + g_term)
												: ("&term=" + g_term);
				ewdNameArray[i] = g_ewdUrlNodes.item(i).selectSingleNode("name").nodeTypedValue;
			}
			var dispEwd ="<div onmouseover=\"this.style.backgroundColor='#dfffff';\" onmouseout=\"this.style.backgroundColor='#f7f9f9';\" style=\"font-family:sans-serif; font-size:70%; height:"+ITEM_HEIGHT+"px; background:#f7f9f9; border: 1px solid #c0c0c0; padding:3px; padding-left:20px;  cursor:hand; filter:;\"><span onclick=\"parent.window.open('"+ewdUrlArray[i]+"','Electrical Wiring Diagram','width=950, height=620, top=30, left=30, menubar=yes, status=yes, resizable=yes, scrollbars=yes')\\\">"+ewdNameArray[i]+"</span></div>"
			g_dispEwds += dispEwd;
		}
		g_dispEwds +="</div>";
//alert(g_dispEwds);
	}
}

</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="guide_global.html" scrolling="no" noresize frameborder="no">
	<frame name="contents" src="guide_contents.html" frameborder="no">
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
