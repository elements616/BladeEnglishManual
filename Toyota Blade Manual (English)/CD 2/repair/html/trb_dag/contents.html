<script language="javascript">
// 要領表示を行う
function init() {
	if (parent.g_cttXml==null)
		return;

	if (parent.g_cttXml.selectNodes("//testgrp").length<1)
		return;

	if (parent.g_fsid==null)
		parent.g_fsid = (parent.g_cttXml).selectSingleNode("//testgrp/@id");

	parent.displayContents((parent.g_fsid).nodeTypedValue);
	parent.loadMemoData (document,parent.REPAIR);
}
function changeModeById(id) {
	var obj = parent.local.document.getElementById(id);
	if (obj != null) {
		parent.changeMode(obj);
	}
}
</script>
</head>
<body onLoad="init();">
