<script language="javascript">
<!--
//
// グローバルナビ各種リンクの表示／非表示設定
//
//
function init() {
  var enableCaution = false;
	var enableIspdata = false;
	if (parent.g_tocXml && parent.g_paraId) {
		enableCaution = parent.hasSiblingParagraph(parent.g_tocXml, parent.g_paraId, "L");
		enableIspdata = parent.hasSiblingParagraph(parent.g_tocXml, parent.g_paraId, "U");
	}
	this.caution.style.visibility=(enableCaution)?"visible":"hidden";
	this.ispdata.style.visibility=(enableIspdata)?"visible":"hidden";
	var pprXml = parent.initXml("ppr_"+parent.g_paraId+".xml",false,false);
	if(pprXml == null) ppr.style.visibility="hidden";
}

//「準備品」クリック時
function switchPreparation(){
	var paraId = parent.g_paraId ;
	if( paraId == null )  return; 
	var args = new Array(paraId);
	parent.setDisplayArgs(args );
	//準備品を画面で表示する
	parent.openDialog("ppr", "ppr_frame.html");
}

//
// 印刷リンク, 準備品リンククリック時の処理
//
function setPopupArguments(type, url) {
	if( parent.g_cttXml == null ) return;
	parent.setDisplaySource(parent.g_cttXml);
	if(type == "print" || type == "tprint"){
		parent.setDisplayArgs(parent.g_args);
	} else 	if(type == "attention" || type == "checkdata" || type == "precheck"){
		parent.setDisplayArgs(parent.g_tocXml);
	} else	if (type == "guide") {
		parent.setDisplayArgs(parent.getParameterValue("term"));
	}
	parent.openDialog(type, url);
}
-->
</script>
