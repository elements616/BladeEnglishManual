<script language="javascript">
//文書構成XMLファイル,グループ一覧XSLファイルを読み込みDOMオブジェクトを作成。
var g_tocXml = initXml("toc_rpr.xml");
g_tocXml.setProperty("SelectionLanguage", "XPath");
var g_sctXsl = initXsl("../../xsl/trb/servcat.xsl");
var g_diaglistXsl    = initXsl("../../xsl/trb/diaglist.xsl");
var g_symptomlistXsl = initXsl("../../xsl/trb/symptomlist.xsl");

// アラート

//
// グローバルナビリンクの表示/非表示切り替え
//
function setGlobalNaviLinks(paraId) {
	if ((g_tocXml==null) || (global==null)) return;
	global.caution.style.visibility=
		(hasSiblingParagraph(g_tocXml, paraId, "L"))?"visible":"hidden";
	global.precheck.style.visibility=
		(hasSiblingParagraph(g_tocXml, paraId, "D"))?"visible":"hidden";
	global.illust.style.visibility=
		(hasSiblingParagraph(g_tocXml, paraId, "R"))?"visible":"hidden";
	global.ispdata.style.visibility=
		(hasSiblingParagraph(g_tocXml, paraId, "U"))?"visible":"hidden";
	global.lprint.style.visibility="visible";
}
</script>
