<!DOCTYPE html>
<!-- $Id: status.html,v 1.25 2004/02/05 16:17:16 kato Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Troubleshooting Contents</title>

<link href="../../css/status.css" rel="stylesheet" type="text/css">
<script language="javascript">
var titleName  ="";
var cateId     ="";
var paraId     ="";

//
//  ローカル画面の初期表示
//  初期化
//
function init() {
	paraId = parent.findParameterValue("parag" , location.search , parent.location.search);
	if (paraId == null) {
		return;
	}
	cateId = parent.findParameterValue("paracat" , location.search , parent.location.search);
	if (cateId == null) {
		return;
	}
	//titleName = parent.getTitleName(paraId,null,"toc_rpr.xml");
	titleName = parent.getTitleName(paraId, parent.g_tocXml);
	setCate(cateId.substring(0,1));
	if (parent.g_tocXml!=null) parent.setGlobalNaviLinks(paraId);
}

//
//  ローカル画面に表示文字を設定する
//  titlenm: 表示文字
//
function setStatus(titlenm) {
	titleName = titlenm;
}

//
//  ローカル画面に表示文字を設定する
//  paracat: ダイアグコード一覧(S)と症状一覧(T)の区別子
//
function setCate(paracat) {
	var thline = "";
	var tdline = "";
	var tdwidth = "0";
	if ( paracat == null ) {
		return;
	} else if ( paracat == "T" ) {
		thline = "<p class='location'>" + titleName + " / Symptom List</p>";
		if (parent.hasSiblingParagraph(parent.g_tocXml, paraId, "S")) {
			var sib = parent.getSiblingParagraph(parent.g_tocXml, paraId, "S");
			var sibId = sib.getAttribute("id");
			tdline = "<a href='status.html?parag="+sibId+"&paracate=S'>" 
				+ "Go to Diagnostic Trouble Code Chart</a>";
			tdwidth = "130";
		}
	} else if ( paracat == "S" ) {
		thline = "<p class='location'>" + titleName + " / DTC List</p>";
		if (parent.hasSiblingParagraph(parent.g_tocXml, paraId, "T")) {
			var sib = parent.getSiblingParagraph(parent.g_tocXml, paraId, "T");
			var sibId = sib.getAttribute("id");
			tdline = "<a href='status.html?parag=" + sibId + "¶cate=T'&gt;Go to Symptom List</a>";
			tdwidth = "75";
		}
	}
	document.body.innerHTML = "<table width='100%' border='0'>" + "<tr>"
		+ "<th align='left' id='disp' >"
		+ thline 
		+ "    </th>"
		+"    <td align='right' width='" + tdwidth + "' class='link'>"
		+ tdline 
		+"    </td>"
		+"  </tr>"
		+"</table>";
	if( parent.contents != null){
		parent.contents.location.href="contents.html?parag="+paraId+"&paracat="+paracat;
	}
}

</script>
</head>
<body onLoad="init();">
</body>
</html>
