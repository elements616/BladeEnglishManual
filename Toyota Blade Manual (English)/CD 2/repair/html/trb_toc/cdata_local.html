<!DOCTYPE html>
<!-- $Id: cdata_local.html,v 1.11 2003/06/11 06:56:54 szg Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Inspection Data</title>


<link href="../../css/local.css" rel="stylesheet" type="text/css">
<script language="javascript">
function init(){
	var paraId = parent.g_hash.keys();
	var paraName = parent.g_hash.values();
	if(paraId == null  ||  paraId.length == 0  ||  paraId == 0){
		alert("The title does not exist!");
		return;
	}

	var paragMenu = "<br/><ol class='ttlmenu'>";
	for(i=0;i<paraId.length;i++){
		var paragM = "<li class='ttlmenu'>"
			+"<a onClick='parent.changeMode(this)' "
			+	"onMouseover='JavaScript:parent.over(this)' "
			+	"onMouseout='JavaScript:parent.out(this)' "
			+	"href='javascript:selectId(\""+paraId[i]+"\")' "
			+	"name='"+paraId[i]+"'>"
			+ paraName[i] 
			+"</a></li>";
		paragMenu = paragMenu + paragM; 
	}
	disp.innerHTML = paragMenu + "</ol>";
	parent.changeMode(document.all[paraId[0]]);
	selectId(paraId[0]);
}

function selectId(id){
	if (  parent.sts==null || parent.sts.location==null
		|| parent.contents==null || parent.contents.location==null) {
		setTimeout("selectId('"+id+"')", 10);
	} else {
		parent.sts.location.href="cdata_status.html?parag="+id;
		parent.contents.location.href="cdata_contents.html?parag="+id;
	}
}
</script>
</head>
<body onLoad="init();">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr>
		<td class="subwindow-text">Inspection Data</td>
	</tr>
	<tr>
		<td><div id="disp"></div></td>
	</tr>
</table>
</body>
</html>
