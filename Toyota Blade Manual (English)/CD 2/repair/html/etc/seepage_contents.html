<!DOCTYPE html>
<!-- $Id: seepage_contents.html,v 1.22 2003/10/17 02:40:56 takeo Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Reference</title>


<link href="../../css/contents.css" rel="stylesheet" type="text/css">
<script language="javascript">
function init() {
	var arg = new parent.Hashtable();
	arg.put("sf", "1");
	parent.display(parent.g_objXml, parent.g_objXsl, disp, arg);

	var titleName = parent.getTitleName(parent.g_paraId);
	var sectionName = parent.getSectionName(parent.g_paraId);
	var cate = parent.g_objXml.selectSingleNode("//para").getAttribute("category");
	var paraName = "";
	if (cate=="C") {
		var dtccodeNode = (parent.g_objXml).selectNodes("//para/dtccode");
		for(i=0;i<dtccodeNode.length;i++){
			var para = dtccodeNode.item(i).nodeTypedValue;
			paraName = paraName + para + "&#160&#160";
		}
	} else {
		var paraNameTag = (cate=="J")?"dtcname":"name";
		paraName = parent.getParagraphName(parent.g_paraId, paraNameTag);
	}
	sdisp.innerHTML = "<p class='location'>" + sectionName + "／" + titleName + " ／ " + paraName + "</p>";

	var br = disp.innerHTML.indexOf("<BR><BR><BR><BR><BR>",0);
	if(br < 0)	brdisp.innerHTML = "<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>";

	if(parent.g_sub != null)location.hash = parent.g_sub;
	if(parent.g_s1 != null) location.hash = parent.g_s1;
	parent.loadMemoData (document,parent.REPAIR);

	if (parent.g_category=="R" || parent.g_category=="K") {
		parent.global.ppr.style.display="none";
		brdisp.style.display="none";
	}
}
function changeModeById(id) {
	// dummy for diagflow. jump to another step.
}
</script>
</head>
<body onLoad="init();">
<div id="sdisp"></div>	
<div id="disp"></div>
<div id ="brdisp"></div>
</body>
</html>
