<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Function-Specific Repair Manual Contents</title>

<script src="../../js/xml.js"></script>
<script src="../../js/util.js"></script>
<script src="../../js/hashtable.js"></script>
<script src="../../js/dom.js"></script>
<script language="javascript">
var g_frpXml = initXml("../../../frp/frp.xml", true, false);
var g_pubXsl = initXsl("../../xsl/toc/frp_pub.xsl");
//var g_lstXsl = initXsl("../../xsl/toc/frp_list.xsl");
var g_lstXsl;
var g_tocXml;
var g_cache  = new Hashtable();

function getFrpList(pubId) {
	if (g_frpXml == null) return;
	g_lstXsl = initXsl("../../../frp/" + pubId.toLowerCase() + "/repair/xsl/toc/frp_list.xsl");
	var xmlPath = "../../../frp/";
	var xmlPath = xmlPath + pubId.toLowerCase() + "/repair/term/toc_rpr.xml";
	if (g_cache.size()>0 && g_cache.containsKey(xmlPath)) {
		g_tocXml = g_cache.get(xmlPath);
	} else {
		g_tocXml = initXml(xmlPath , true);
		if (g_tocXml!=null)	g_cache.put(xmlPath, g_tocXml);
	}
	//var ttlNode = g_frpXml.selectSingleNode("//pub[@id='"+pubId+"']/longname");
	//sts.disp.innerHTML = "<p class='location'>" + ttlNode.nodeTypedValue + "</p>";
	if (sts.disp==null) return;
	parent.display(g_tocXml, g_lstXsl, contents.disp, null);
	dispTtl(pubId);
}

function dispTtl(pubId) {
	if (g_frpXml==null) return;
	var ttlNode = g_frpXml.selectSingleNode("//pub[@id='"+pubId.toUpperCase()+"']/longname");
	sts.disp.innerHTML = "<p class='location'>" + ttlNode.nodeTypedValue + "</p>";
}
</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="frp_global.html" scrolling="no" noresize frameborder="no">
	<frameset cols="222, *" frameborder="yes" border="1" framespacing="1" bordercolor="#cccccc">
		<frame name="local" src="frp_local.html" frameborder="no" >
		<frameset rows="30, *" frameborder="no" border="0" framespaceing="0">
			<frame name="sts" src="frp_status.html" frameborder="no" scrolling="auto">
			<frame name="contents" src="frp_contents.html" frameborder="no">
		</frameset>
	</frameset>
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
