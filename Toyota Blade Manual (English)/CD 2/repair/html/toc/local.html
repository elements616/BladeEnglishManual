<!DOCTYPE html>
<!-- $Id: local.html,v 1.21 2003/12/05 11:03:57 kato Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Repair Manual Contents</title>

<link href="../../css/local.css" rel="stylesheet" type="text/css">
<script src="../../js/servcat.js"></script>
<script language="javascript">
//
//  マウスオーバー時のポップアップ画面内のクリック時に呼ばれる処理
//
function selectSubMenu() {
	var srcElem = getSrcElement();
	var str = srcElem.id;
	var sctId  = parent.getParameterValue("servcat", str);
	var secId  = parent.getParameterValue("section", str);
	var ttlId  = parent.getParameterValue("ttl", str);
	var paraId = parent.getParameterValue("parag", str);
	var sts    = parent.getParameterValue("status", str);
	if ( paraId ==null )  return;
	undispSubMenu();
	//alert("sctId ="+sctId +"  ttlId ="+ttlId+"  secId="+secId  +"  paraId ="+paraId +"  sts ="+sts );
	clickMenu( sctId , secId , paraId );
}

//
//  マウスオーバー時の総説やサービスデータなど画面内のクリック時に呼ばれる処理
//  sctId:  サービスカテゴリID
//  hashId: URLのハッシュ(#)
//  paraId: パラグラフID
//
function clickMenu( sctId , hashId, paraId ) {
	if (  parent.sts==null || parent.sts.location==null
		|| parent.contents==null || parent.contents.location==null) {
		//alert("parent.sts. null");
		setTimeout("clickMenu('"+sctId+"','"+hashId+"','"+paraId+"')", 10);
		//alert("clickMenu('"+sctId+"','"+hashId+"','"+paraId+"')");
	} else {
		parent.sts.location.href="status.html?parag="+paraId;
		parent.contents.location.href="contents.html?servcat=" + sctId + "#" + hashId;
	}
}

//
//  ローカルナビ画面の初期表示
//  マウスオーバー時のポップアップの初期化
//  作成したDOMオブジェクトを使用して指定されたHTML要素に画面表示。
//
function init() {
	parent.display(parent.g_tocXml, parent.g_sctXsl, disp, null);
	createSubMenu(this, selectSubMenu);
	g_popup.document.createStyleSheet('../../css/popup.css');
	
	//戻る場合は元状態に復元する
	var paraId = parent.findParameterValue("hashparag",parent.location.search);
	var sctId  = parent.findParameterValue("servcat",parent.location.search);
	if( paraId == null || sctId == null) {
		return;
	} else {
		var secIdNode = parent.g_tocXml.selectSingleNode("//section[.//para/@id='"+paraId+"']/@id");
		var secId = secIdNode.nodeTypedValue;
		clickMenu(sctId , secId, paraId);
	}
}
</script>
</head>
<body onLoad="init()">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr>
		<td class="text">Contents List</td>
	</tr>
</table>
<div id="disp"></div>
</body>
</html>
