<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">

<title>[Electronic Technical Manual] - Inspection Illustrated Index</title>

<link href="../../css/contents.css" rel="stylesheet" type="text/css">
<script src="../../js/svg.js"></script>
<script language="javascript">
//
//  ローカル画面の初期表示
//  初期化
//
function init() {
	initSvg( window.self );
	paraId = parent.findParameterValue("parag" , location.search , parent.location.search);
	illustId = parent.findParameterValue("illust" , location.search , parent.location.search);
	if (illustId == null) {
		if (paraId == null) {
			//alert("パラグラフIDがありません。");
			document.all('msg').style.display = "none";
			return;
		}
		var illustIds = parent.getIllustIdList(paraId);
		if (illustIds == null ){
			alert("("+paraId+") illustration ID list cannot be obtained.");
			return;
		}
		illustId = illustIds[0];
	}
	createSVGInnerHtml(disp, illustId);
	svgTitle.innerHTML = illustId;
	setTimeout("changeColorPart()", ONLOAD_POLLING_TIME);
	setTimeout("hideMessage()", ONLOAD_POLLING_TIME);
	parent.global.document.getElementById('print').style.visibility="visible";
}
  
function changeColorPart(){
	var svgobj = document.all('svgdata');
	if (svgobj != null) {
		forceChangeAllTxtCol( svgdata , COLOR_DEF_LINK);
	}else{
		setTimeout("changeColorPart()", ONLOAD_POLLING_TIME);
	}
}
  
</script>
</head>
<body onLoad="init();">
	<center>
		<div id='msg' class='message' ><br/><br/><br/>Please wait. 。 。</div>
	</center>
	<div id="disp">
		<table border="0" cellspacing="0" cellpadding="0" width="621" height="352">
			<tr>
				<td class="initial-display">
					<table width="520" border="0" cellspacing="0" cellpadding="0">
						<tr>
							<td class="gray5" width="380">Repair Manual</td>
							<td class="gray4" width="140">Inspection Procedure</td>
						</tr>
						<tr>
							<td colspan="2"> </td>
						</tr>
						<tr>
							<td class="text00" colspan="2">Select an item from the pull-down in the left menu.</td>
						</tr>
						<tr> 
							<td colspan="2"> </td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</div>
	<div id='svgTitle' class='illustId'></div>
</body>
</html>
