<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">

<title>[Electronic Technical Manual] - Inspection Illustrated Index</title>

<link href="../../css/local.css" rel="stylesheet" type="text/css">
<script src="../../js/servcat.js"></script>
<script language="javascript">
//
//  マウスオーバー時のポップアップ画面内のクリック時に呼ばれる処理
//
function selectSubMenu() {
	var srcElem = getSrcElement();
	var str = srcElem.id;
	var sctId     = parent.getParameterValue("servcat", str);
	var secId     = parent.getParameterValue("section", str);
	var ttlId     = parent.getParameterValue("ttl", str);
	var secvarId  = parent.getParameterValue("sectionvar", str);
	var ttlvarId  = parent.getParameterValue("ttlvar", str);
	var paraId    = parent.getParameterValue("parag", str);
	var sts       = parent.getParameterValue("status", str);
	if ( paraId ==null )  return;

	undispSubMenu();
	//alert("sctId ="+sctId +"  ttlId ="+ttlId +"  paraId ="+paraId +"  sts ="+sts );
	//alert("secvarId="+secvarId+"  ttlvarId="+ttlvarId +"  paraId ="+paraId +"  str ="+str );
	parent.sts.location.href="status.html?parag="+paraId;
	//parent.contents.location.href="contents.html?parag="+paraId;
	parent.button.location.href="button.html?parag="+paraId
		//+"&section="+secId
		//+"&ttl="+ttlId
		//+"&sectionvar="+secvarId
		//+"&ttlvar="+ttlvarId
		;
}

//
//  ローカルナビ画面の初期表示
//  マウスオーバー時のポップアップの初期化
//  作成したDOMオブジェクトを使用して指定されたHTML要素に画面表示。
//
function init() {
	parent.display(parent.g_tocXml, parent.g_sctXsl, disp, null);
	createSubMenu(this, selectSubMenu);
	g_popup.document.createStyleSheet('../../css/popup.css');
}
</script>
</head>
<body onLoad="init()">
<table width="100%" border="0" cellspacing="0" cellpadding="0">
	<tr>
		<td class="text">Inspection Procedure</td>
	</tr>
</table>
<div id="disp"></div>
</body>
</html>
