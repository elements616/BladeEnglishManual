<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Inspection Illustrated Index</title>

<link href="../../css/button.css" rel="stylesheet" type="text/css">
<script src="../../js/svgpage.js"></script>
<script language="javascript">
var g_procXml;
var g_paraId ="";
var g_termId ="";
var g_paraParentParameter ="";

//
//  ローカル画面の初期表示
//  初期化
//
function init() {
	g_illustId = parent.findParameterValue("illust", location.search, parent.location.search);
	g_termId   = parent.findParameterValue("term",   location.search, parent.location.search);
	g_paraId   = parent.findParameterValue("parag",  location.search, parent.location.search, parent.sts.location.search, parent.contents.location.search);
	if (g_paraId == null) {
		return;
	}

	g_paraParentParameter = parent.getParaParentParameter(parent.g_tocXml , g_paraId );
	secId    = parent.findParameterValue("section" , g_paraParentParameter);
	secvarId = parent.findParameterValue("sectionvar" , g_paraParentParameter);
	//alert("g_paraParentParameter="+g_paraParentParameter);
	//alert("secId ="+secId +" secvarId ="+secvarId );

	var SVGItem = parent.getIllustIdList(g_paraId);
	if (SVGItem == null  || SVGItem.length == 0){
		alert("There is no applicable illustration. [Paragraph ID:"+g_paraId+"]");
		return;
	}

	g_procXml  = parent.initXml("proc_"+secId+".xml",false,false);
	if ( g_procXml == null ) {
		alert("Relevant File "+"proc_"+ secId +".xml does not exist.");
		return;
	}

	if( g_illustId == null ){
		g_illustId = SVGItem[0];
	}else{
		for(var i=0;i<SVGItem.length;i++){ 
			if(SVGItem[i] == g_illustId) break;
			if(i == SVGItem.length-1) g_illustId = SVGItem[0];
		}
	}
	var  dispPage = createDispPage(SVGItem);
	document.body.innerHTML = dispPage ; 
	//SVG表示画面にSVGページを表示する
	selPage(g_illustId);
}

//
//  点検　個別表示画面
//
function singleDisplay() {
	var s1Url  = "s1_frame.html";
	var prtUrl = "s1prt_frame.html";
	var partId = parent.contents.getXMLSelectPartID();
	if( partId == null || partId == "" ){
		alert("Please select a part.");
		return;
	}

	var objTemp  = new ActiveXObject("Msxml2.XSLTemplate");
	objTemp.stylesheet = parent.g_runXsl;
	var objProc  = objTemp.createProcessor();

	//所属セクションファイルに検索する
	//var paraItems = parent.getParaList(partId , g_procXml);
	var paraItems = getPartsParagraphs(partId, g_procXml);
	if (paraItems == null) {
		return;
	}

	//所属サービスの全セクションに検索する
	if ( paraItems.length == 0 ) {
		var serviceId = getServiceId(secId);
		var tmpXml    = parent.initXml("psearch_"+serviceId +".xml",false,false);
		if ( tmpXml == null ) {
			alert("Relevant File "+"psearch_"+serviceId +".xml does not exist.");
			return;
		}
		//paraItems = parent.getParaList(partId , tmpXml);
		paraItems = getPartsParagraphs(partId , tmpXml);
	}
	// If title select dialog was closed, paraItems is null
	if (paraItems==null) return;

	// 全サービスカテゴリの全セクションに検索する
	if (paraItems.length == 0) {
		tmpXml = parent.initXml("psearch_all" + ".xml",false,false);
		if ( tmpXml != null ) {
			paraItems = getPartsParagraphs(partId , tmpXml);
		}
	}

	if (paraItems==null) return;

	if (paraItems.length==0) {
		alert("The applicable procedure has not been created. [Part ID:"+partId +"]");
		return;
	}

	//alert("partId ="+partId+"  "+secId +"  paraItems.length="+paraItems.length);
	var paraNode = paraItems[0];
	//一つParaIdを取る，脱着要領表示　リング表示かどうかのため
	var selectParaId  = paraNode.getAttribute("id");
	//脱着要領表示へ飛ぶのパラメータのため
	var selectTitleId = paraNode.parentNode.getAttribute("id");
	//alert("selectParaId="+selectParaId+"  selectTitleId ="+selectTitleId );

	var ttlName = parent.getTitleName(selectParaId);
	var sectionName = parent.getSectionName(selectParaId);
	var dispPage = "<p class='location'>"+ sectionName + "／" + ttlName + "</p>";

	//全部品の表示ページを組み合わせる
	for (var i=0; i<paraItems.length; i++) {
		paraNode = paraItems[i];
		//alert("paraId ="+paraNode.getAttribute("id") );
		var paraXml = parent.initXml(paraNode.getAttribute("id")+".xml",false,false);
		if ( paraXml == null ) {
			alert("Relevant File "+paraNode.getAttribute("id")+".xml does not exist.");
			return;
		}
		objProc.input = paraXml;
		objProc.transform();
		//個別表示画面ソースを作成する
		dispPage += objProc.output; 
		//alert("dispPage ="+dispPage );
	}

	//組み合わせる全部品ページを新しい画面で表示する
	parent.setDisplayArgs(new Array( dispPage , parent.g_tocXml, selectParaId));
	var ret  = parent.openDialog("singledisplay", s1Url);
	switch (ret) {
		//閉じる
		case "close":
			break;
		//脱着要領表示へ飛ぶ
		case "remove":
			parent.location.href="../rmv_ctt/frame.html"
				+parent.getCttLink(g_paraId,g_illustId,g_termId,selectTitleId,parent.g_tocXml);
			break;
		//印 刷	
		case "print":
			parent.setDisplayArgs(new Array(g_illustId , dispPage, parent.sts.document.body.innerHTML));
			//組み合わせる全部品ページを印刷画面で表示する
			parent.openDialog("pdisplay", prtUrl);
	}
}

//
//  点検　全体表示画面
//
function allDisplay() {
	var partId = parent.contents.getXMLSelectPartID();
	if( partId == null || partId == "" ){
		alert("Please select a part.");
		return;
	  }

	//所属セクションファイルに検索する
	var selectTitleId = getPartsTitle(partId, g_procXml);
	if ( selectTitleId == null ) {
		return;
	}
	//所属するセクションに部品ID完全一致のデータを探す
	if ( selectTitleId != "" ) {
		parent.location.href = "../isp_ctt/frame.html" 
				+ parent.getCttLink(g_paraId,g_illustId,g_termId,selectTitleId,parent.g_tocXml);
		return;
	}
	//alert("partId ="+partId);

	//所属サービスの全セクションに部品ID完全一致のデータを探す
	var serviceId = getServiceId(secId);
	var tmpXml    = parent.initXml("psearch_"+serviceId +".xml",false,false);
	if ( tmpXml == null ) {
		alert("Relevant File "+"psearch_"+serviceId +".xml does not exist.");
		return;
	}
	var selectTitleId = getPartsTitle(partId, tmpXml);
	if ( selectTitleId == null ) {
		return;
	}
	if ( selectTitleId != "" ) {
		parent.location.href = "../isp_ctt/frame.html" 
				+ parent.getCttLink(g_paraId,g_illustId,g_termId,selectTitleId,parent.g_tocXml);
		return;
	}
	alert("The applicable procedure has not been created. [Part ID:"+partId +"]");
}

// 
// セクションIDからサービスカテゴリIDを取得する
// sectionId : セクションID
//
function getServiceId( sectionId ) {
	var section = parent.g_tocXml.selectSingleNode("//section[@id='"+ sectionId +"']");
	var serviceId = section.parentNode.getAttribute("id"); 
	return serviceId;
}

//
// セクションIDからサービスカテゴリIDを取得する
// partsId: 部品ID
// obj: 手順XMLまたは部品検索XMLのDOMオブジェクト
//
function getPartsParagraphs(partsId, obj) {
	var ret = new Array();
	// 指定部品を直下に持つタイトルを検索し、タイトルIDのリストを取得する
	var idList = obj.selectNodes("//ttl[parts/@id='"+partsId+"' and para/@category='G']/@id");
	if (idList.length<1) return ret;

	var partsXml = parent.initXml("parts.xml");
	//
	parent.setDisplayArgs(new Array(parent.g_tocXml, idList, partsXml, partsId));
	if (idList.item(0)==null) return null;
	// タイトルが複数ヒットした場合はタイトル選択ダイアログで選択させる
	var ttlId = (idList.length==1)
						? idList.item(0).nodeTypedValue
						: parent.openDialog("alldisplay", "ttl_frame.html");
	if (ttlId==null) return null;
	parent.setDisplayArgs(null);

	// 特定タイトル配下で指定部品を持つパラグラフのリストを取得する
	var paraItems = obj.selectNodes("//ttl[@id='"+ttlId+"' and parts[@id='"+partsId+"']]/para[@category='G']");
	for (var i=0; i<paraItems.length; i++) {
		ret.push(paraItems.item(i));
	}
	return ret;	
}

//
// 部品IDからタイトルIDを取得する
// partsId: 部品ID
// obj: 手順XMLまたは部品検索XMLのDOMオブジェクト
//
function getPartsTitle(partsId, obj) {
	// 指定部品を直下に持つタイトルを検索し、タイトルIDのリストを取得する
	var idList = obj.selectNodes("//ttl[parts/@id='"+partsId+"' and para/@category='G']/@id");
	if (idList.length<1) return "";
	var partsXml = parent.initXml("parts.xml");
	parent.setDisplayArgs(new Array(parent.g_tocXml, idList, partsXml, partsId));
	if (idList.item(0)==null) return null;
	// タイトルが複数ヒットした場合はタイトル選択ダイアログで選択させる
	var ttlId = (idList.length==1)
						? idList.item(0).nodeTypedValue
						: parent.openDialog("alldisplay", "ttl_frame.html");
	if (ttlId==null) return null;
	parent.setDisplayArgs(null);
	return ttlId;	
}
</script>
</head>
<body onLoad="init();">
</body>
</html>
