<!DOCTYPE html>
<!-- $Id: ewd_contents.html,v 1.13 2004/04/01 07:37:34 s-okino Exp $ -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../_runtime/legacy.css">
<script src="../../../../_runtime/compat.js"></script>

<title>[Electronic Technical Manual] - Wiring Diagram Link</title>

<link href="../../css/contents.css" rel="stylesheet" type="text/css">
<script language="javascript">
var g_ttlId ;
var g_paraId ;
var g_termId ;

// タイトルIDから次の要領表示画面へ遷移する
function gotoRemove() {
	parent.location.href="../rmv_ctt/frame.html"
		+ parent.getCttLink(g_paraId,"",g_termId,g_ttlId,parent.g_tocXml);
}

//
//  Contents画面の初期表示
//  初期化
//
function init() {
	g_termId   = parent.findParameterValue("term" , location.search , parent.location.search );
	partId  = parent.findParameterValue("parts" ,  location.search ,  parent.location.search );
	if( partId == null || partId == "" ){
		alert("Not enough parameters. Please specify a part.");
		return;
	}
	var objTemp  = new ActiveXObject("Msxml2.XSLTemplate");
	objTemp.stylesheet = parent.g_runXsl;
	var objProc  = objTemp.createProcessor();
	var linkXml = parent.initXml("link.xml");
	if (linkXml==null) {
		alert("The XML file required for search cannot be found. [link.xml]");
		return;
	}
	var paraItems = getPartsParagraphs(partId, linkXml);
	if (paraItems==null) return;
	if ( paraItems.length == 0 ) {
		alert("There is no applicable procedure. [Part ID:"+partId +"]");
		return;
	}

	//alert("partId ="+partId+"  "+secId +"  paraItems.length="+paraItems.length);
	var   paraNode     = paraItems[0];
	//一つParaIdを取る，脱着要領表示　リング表示かどうかのため
	g_paraId  = paraNode.getAttribute("id");
	//脱着要領表示へ飛ぶのパラメータのため
	g_ttlId = paraNode.parentNode.getAttribute("id");

	var ttlName = parent.getTitleName(g_paraId);
	var sectionName = parent.getSectionName(g_paraId);
	var  dispPage = "<p class='location'>"+ sectionName + "／" + ttlName + "</p>";

	//全部品の表示ページを組み合わせる
	for (var i=0; i<paraItems.length; i++) {
		paraNode = paraItems[i];
		//alert("paraId ="+paraNode.getAttribute("id") );
		var paraXml = parent.initXml(paraNode.getAttribute("id")+".xml");
		if ( paraXml == null ) {
			alert("Relevant File "+paraNode.getAttribute("id")+".xml does not exist.");
			return;
		}
		objProc.input = paraXml;
		objProc.transform();
		//個別表示画面ソースを作成する
		dispPage += objProc.output; 
	}

	disp.innerHTML = dispPage ;
	parent.global.remove.style.visibility =
		(parent.hasSiblingParagraph(parent.g_tocXml, g_paraId, "A"))?"visible":"hidden";
	parent.loadMemoData (document,parent.REPAIR);
}

function getPartsParagraphs(pid, obj) {
	var ret = new Array();
	var idList = obj.selectNodes("//ttl[parts/@id='"+pid+"']/@id");
	if (idList.length<1) return ret;
	var partsXml = parent.initXml("parts.xml");
	parent.setDisplayArgs(new Array(parent.g_tocXml, idList, partsXml, pid));
	var ttlId = (idList.length==1)
						? idList.item(0).nodeTypedValue
						: parent.openDialog("alldisplay", "ttl_frame.html");
	if (ttlId==null) return null;
	parent.setDisplayArgs(null);
	var paraItems = parent.g_tocXml.selectNodes("//ttl[@id='"+ttlId+"']/para[@category='G']");
	for (var i=0; i<paraItems.length; i++) {
		ret.push(paraItems.item(i));
	}
	return ret;	
}
</script>
</head>
<body onLoad="init()">
	<div id="disp"></div>
</body>
</html>
