<html lang="en">
<head>
<meta charset="utf-8">

<title>[Electronic Technical Manual] - Show Individually</title>

<script src="../../js/dom.js"></script>
<script src="../../js/util.js"></script>
<script src="../../js/xml.js"></script>
<script src="../../js/hashtable.js"></script>
<script src="../../js/memo.js"></script>
<script language="javascript">
//
//  Contents画面の初期表示
//  初期化
//
function initContents() {
	var args = window.dialogArguments;
	if (args == null || args.length != 3) {
		alert("The parameter is invalid.");
		return;
	}
	var dispPage = args[0];
	var tocXml = args[1];
	var paraId   = args[2];
	contents.disp.innerHTML=dispPage;
	global.remove.style.visibility = (hasSiblingParagraph(tocXml, paraId, "A"))?"visible":"hidden";
	loadMemoData (contents.document,REPAIR);
}
</script>
</head>
<frameset rows="30, *" frameborder="no" border="0" framespacing="0">
	<frame name="global" src="s1_global.html" scrolling="no" noresize frameborder="no">
	<frame name="contents" src="s1_contents.html" frameborder="no">
</frameset>
<noframes>
	<body>Please use a browser that supports frames</body>
</noframes>
</html>
